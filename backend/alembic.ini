[alembic]
script_location = %(here)s/alembic

# T-062: versions/ is split into one subdirectory per module so a disabled
# module's migration never gets autogenerated against by accident and the
# revision tree stays easy to navigate. Every directory is always listed
# here -- the scripts themselves ship with the template regardless of
# product.config.py. What's actually conditional is which `alembic upgrade`
# *targets* app.core.migrations ever asks for; see that module for why
# listing a script here does not mean it gets applied.
version_locations = %(here)s/alembic/versions/core
    %(here)s/alembic/versions/billing
    %(here)s/alembic/versions/gdpr
    %(here)s/alembic/versions/notifications
    %(here)s/alembic/versions/file_storage
    %(here)s/alembic/versions/product
path_separator = newline

# Makes the backend/ directory (where this file lives) importable so
# alembic/env.py can `import app...`. Required when invoking the `alembic`
# CLI directly rather than through pytest.
prepend_sys_path = .

# sqlalchemy.url is intentionally omitted — alembic/env.py loads it from
# Settings.DATABASE_URL via app.core.config.get_settings(), never from this
# file (§0.6: secrets only through pydantic-settings).

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
