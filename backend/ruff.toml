line-length = 100
target-version = "py312"

[lint]
select = ["ALL"]
ignore = [
    # --- project convention: no docstrings unless the WHY is non-obvious ---
    "D",
    # --- conflict with `ruff format` (see ruff docs: rules that conflict with the formatter) ---
    "COM812",
    "COM819",
    "D206",
    "D300",
    "E111",
    "E114",
    "E117",
    "ISC001",
    "ISC002",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "W191",
    # --- TODOs are tracked as tasks in agents.md, not inline ---
    "FIX002",
    "TD002",
    "TD003",
    # --- DomainError messages are plain, user-actionable strings by design (§0.5) ---
    "EM101",
    "EM102",
    "TRY003",
    # --- FastAPI dependency-injected booleans are not the "boolean trap" this rule targets ---
    "FBT001",
    "FBT002",
]

[lint.per-file-ignores]
# tests favor asserts, magic values, and untyped fixtures over production-grade typing
"tests/**" = ["S101", "ANN001", "ANN201", "ANN202", "S105", "S106", "PLR2004", "SLF001"]
# backend/scripts/* are developer CLIs, not importable app code: INP001 (no
# __init__.py -- they are run as `python scripts/x.py`) and T201 (printing to
# the terminal is the entire point of a CLI).
"scripts/**" = ["INP001", "T201"]
# alembic migrations are generated/templated, not hand-styled application code.
# F401: script.py.mako always imports sqlmodel for AutoString columns, even in
# migrations that end up with none.
"alembic/**" = ["ANN001", "ANN201", "ERA001", "INP001", "F401"]

[lint.isort]
known-first-party = ["app"]
# Without this, isort confuses the PyPI "alembic" package with the local
# backend/alembic/ directory and miscategorizes "import alembic" as first-party.
known-third-party = ["alembic"]
