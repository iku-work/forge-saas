[mypy]
strict = True
python_version = 3.12
plugins = pydantic.mypy

# authlib ships no py.typed marker / stub package (T-023's oauth.py uses
# authlib.integrations.httpx_client.AsyncOAuth2Client) -- without this, every
# import of it fails strict mode with "missing library stubs".
[mypy-authlib.*]
ignore_missing_imports = True

# apscheduler ships no py.typed marker either (T-034's scheduler.py uses
# apscheduler.schedulers.asyncio.AsyncIOScheduler + .triggers.cron.CronTrigger).
[mypy-apscheduler.*]
ignore_missing_imports = True

# boto3/botocore ship no py.typed marker (T-037's export job talks to S3/R2/
# MinIO directly via boto3 -- the boto3-stubs/botocore-stubs packages exist
# but aren't worth the added dev dependency for one job's worth of calls).
[mypy-boto3.*]
ignore_missing_imports = True
[mypy-botocore.*]
ignore_missing_imports = True

# opentelemetry-instrumentation-fastapi/sqlalchemy ship no py.typed marker
# (T-203's tracing.py instruments FastAPI + the async engine's sync core with
# these). opentelemetry-instrumentation-redis and the OTLP exporter do ship
# one, so they aren't listed here.
[mypy-opentelemetry.instrumentation.fastapi.*]
ignore_missing_imports = True
[mypy-opentelemetry.instrumentation.sqlalchemy.*]
ignore_missing_imports = True
