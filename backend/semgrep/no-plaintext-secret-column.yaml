rules:
  - id: no-plaintext-secret-column
    languages: [python]
    severity: ERROR
    message: >-
      Column name ends in _secret/_key/_token/_encrypted but is declared as a
      plaintext Column(Text) or Column(String) (§0.6). Wrap it in
      EncryptedString — see app.core.encrypted_type.
    patterns:
      - pattern-either:
          - pattern: $FIELD = Column(Text, ...)
          - pattern: $FIELD = Column(String, ...)
          - pattern: $FIELD = Field(sa_column=Column(Text, ...))
          - pattern: $FIELD = Field(sa_column=Column(String, ...))
          - pattern: "$FIELD: $TYPE = Column(Text, ...)"
          - pattern: "$FIELD: $TYPE = Column(String, ...)"
          - pattern: "$FIELD: $TYPE = Field(sa_column=Column(Text, ...))"
          - pattern: "$FIELD: $TYPE = Field(sa_column=Column(String, ...))"
      - metavariable-regex:
          metavariable: $FIELD
          regex: ^.*(_secret|_key|_token|_encrypted)$
    paths:
      exclude:
        - "**/app/core/encrypted_type.py"
