[project]
name = "forge-saas-backend"
version = "0.1.0"
description = "ForgeSaaS backend — FastAPI service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.14.2", # GHSA-4xgf-cpjx-pc3j fixed in 2.14.2 (T-054 pip-audit)
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    "cryptography>=42.0",
    "python-jose[cryptography]>=3.3",
    "pyotp>=2.9",
    "authlib>=1.3",
    "python-multipart>=0.0.12",
    "arq>=0.26",
    "apscheduler>=3.10",
    "redis>=5.0",
    "stripe>=11.0",
    "resend>=2.4",
    "slowapi>=0.1.9",
    "loguru>=0.7",
    "sentry-sdk[fastapi]>=2.15",
    "opentelemetry-distro>=0.48b0",
    "prometheus-fastapi-instrumentator>=7.0",
    "boto3>=1.35",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "babel>=2.16", # Accept-Language negotiation (T-068)
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "testcontainers[postgres,redis,minio]>=4.8",
    "polyfactory>=2.18",
    "schemathesis>=3.36",
    "freezegun>=1.5",
    "bandit>=1.7",
    "semgrep>=1.168",
    "pip-audit>=2.10",
    "import-linter>=2.1",
    "pre-commit>=4.0",
    "detect-secrets>=1.5",
    "types-python-jose>=3.3",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
core = "sysmon"
