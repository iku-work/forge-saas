[project]
name = "forge-saas-backend"
version = "0.1.0"
description = "ForgeSaaS backend — FastAPI service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.14.2", # GHSA-4xgf-cpjx-pc3j fixed in 2.14.2 (T-054 pip-audit)
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    "cryptography>=42.0",
    "python-jose[cryptography]>=3.3",
    "pyotp>=2.9",
    "webauthn>=3.0", # T-217 — FIDO2/WebAuthn second factor
    "authlib>=1.3",
    "python-multipart>=0.0.12",
    "arq>=0.26",
    "apscheduler>=3.10",
    "redis>=5.0",
    "stripe>=11.0",
    "resend>=2.4",
    "slowapi>=0.1.9",
    "loguru>=0.7",
    "sentry-sdk[fastapi]>=2.15",
    "opentelemetry-distro>=0.48b0",
    # Pinned exactly, not >=: semgrep (a dev dependency below) pins
    # opentelemetry-api/sdk/exporter-otlp-proto-http to ~=1.37.0 and
    # opentelemetry-instrumentation-requests/threading to ~=0.58b0, and (since
    # every contrib package here shares one opentelemetry-instrumentation
    # core) that transitively caps opentelemetry-api at 1.37.x -- there is no
    # published opentelemetry-instrumentation-fastapi release that both fixes
    # the _get_route_details() bug worked around in tracing.py's
    # _patch_fastapi_partial_match_bug() (needs >=0.64b0, i.e. api>=1.43.0)
    # and satisfies semgrep's cap. Letting these three float to a newer
    # contrib release drags opentelemetry-api/sdk/instrumentation along with
    # them and `pip check` starts reporting conflicting requirements against
    # semgrep's own pins.
    "opentelemetry-instrumentation-fastapi==0.58b0",
    "opentelemetry-instrumentation-sqlalchemy==0.58b0",
    "opentelemetry-instrumentation-redis==0.58b0",
    "opentelemetry-exporter-otlp-proto-http==1.37.0",
    # >=8.0.2, not just >=7.0: 8.0.0/8.0.1's routing._get_route_name assumes
    # include_router() eagerly flattens child routes into APIRoute objects
    # with a .path attribute. This FastAPI's (0.137.2) include_router() wraps
    # sub-routers in a lazy _IncludedRouter instead (same quirk already noted
    # for router.routes in T-061) -- 8.0.0/8.0.1 crash with AttributeError on
    # every single request once the middleware is actually wired in (T-202).
    "prometheus-fastapi-instrumentator>=8.0.2",
    "boto3>=1.35",
    # T-225 — content-sniffing on upload confirm (app.modules.storage.service).
    # Linux/macOS python-magic is a thin ctypes wrapper around the system
    # libmagic1 (installed in Dockerfile/Dockerfile.dev); Windows has no
    # system libmagic; a mismatch here doesn't raise ImportError, it
    # segfaults the interpreter. python-magic-bin bundles prebuilt libmagic
    # binaries so `import magic` works the same way on a bare Windows dev
    # machine running `pytest` outside Docker.
    "python-magic>=0.4.27; sys_platform != 'win32'",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "babel>=2.16", # Accept-Language negotiation (T-068)
    "pybreaker>=1.2",
    "tenacity>=9.0",
    # pybreaker's asyncio support (CircuitBreaker.call_async) is built on
    # tornado's Future -- awaitable directly from plain asyncio code since
    # tornado 5 -- rather than a bespoke asyncio state machine; see
    # app.core.resilience's module docstring (T-206).
    "tornado>=6.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "testcontainers[postgres,redis,minio]>=4.8",
    "polyfactory>=2.18",
    "schemathesis>=3.36",
    "freezegun>=1.5",
    "bandit>=1.7",
    "semgrep>=1.168",
    "pip-audit>=2.10",
    "import-linter>=2.1",
    "pre-commit>=4.0",
    "detect-secrets>=1.5",
    "types-python-jose>=3.3",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "owasp(category): proves the mitigation for an OWASP Top 10 category (A01-A10), cross-checked by tests/security/test_owasp_mapping.py and docs/security/owasp-top10.md",
]

[tool.coverage.run]
core = "sysmon"
# T-250: app/modules/_template is a scaffold that ships uncalled by design --
# nothing registers its router or imports its models, which is exactly what
# tests/test_module_template.py asserts. Measuring it would mean every line
# added to the template costs coverage against CI's --cov-fail-under=85 while
# ruff, mypy --strict, and (in T-251) the generated module's own test run are
# what actually keep it honest.
omit = ["app/modules/_template/*"]

[tool.coverage.report]
# Keeps coverage.py's own defaults (`pragma: no cover`) and adds the CLI
# guard: `python -m app.core.seed` / `.migrations` / `.workers.jobs.encryption`
# each end in a two-line entrypoint that only delegates to a function the
# suite calls directly. Counting those lines as missed would mean a module
# can never be fully covered just for having a CLI.
exclude_also = ['if __name__ == "__main__":']
