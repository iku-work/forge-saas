# T-211: the aggressive counterpart to ci.yml's zap-baseline job (T-210).
# Runs active attacks (SQLi, XSS, command injection, ...) against a real
# staging deployment instead of a passive pass against a throwaway compose
# stack -- active scanning sends real attack payloads, so it only runs
# somewhere nothing else depends on, on a schedule instead of every PR.
#
# Dormant until these are configured on the repo (Settings -> Secrets and
# variables -> Actions), same as ci.yml's `deploy` job (see
# docs/runbooks/deploy-render.md):
#   - STAGING_URL (variable)         -- e.g. https://staging.example.com
#   - ZAP_SCANNER_EMAIL (secret)     -- login for a dedicated MEMBER-role
#                                        user, its own org, synthetic data
#   - ZAP_SCANNER_PASSWORD (secret)
# Until STAGING_URL is set the job is skipped (grey, not red). It used to run
# and fail every night, which taught everyone to ignore this workflow -- the
# opposite of a signal (changed 2026-10-14).
#
# Rotate ZAP_SCANNER_EMAIL/PASSWORD the same way as every other staging
# secret: rotate the password on the staging user itself (or recreate the
# account), then update the GitHub Actions secret to match -- nothing else
# references these credentials.
#
# T-225: also runs a testssl.sh scan of STAGING_URL's negotiated TLS
# versions/cipher suites (ASVS V9.1.2/V9.1.3), same STAGING_URL dependency
# and dormant-until-configured behavior as the ZAP step.
name: ZAP Full Scan

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  zap-full-scan:
    if: vars.STAGING_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      issues: write # to file/dedupe findings as issues, see "File findings" below

    steps:
      - uses: actions/checkout@v5

      - name: Make report output directory
        run: mkdir -p zap-reports

      # T-225/ASVS V9.1.2, V9.1.3: an independent scan of staging's actual
      # negotiated TLS versions/cipher suites, not just trust in Caddy's
      # defaults. Same dormant-until-STAGING_URL pattern as the ZAP step
      # below -- runs regardless of whether STAGING_URL is set yet (it just
      # fails fast against an empty URL the same way the ZAP step does).
      - name: TLS version/cipher-suite scan (testssl.sh)
        if: always()
        run: |
          docker run --rm -v "$PWD/zap-reports:/output" drwetter/testssl.sh \
            --severity HIGH --protocols --ciphers \
            --jsonfile /output/testssl-report.json \
            "${{ vars.STAGING_URL }}"

      - name: Upload testssl.sh report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: testssl-report
          path: zap-reports/testssl-report.json
          retention-days: 90

      # zaproxy/action-af wraps `docker run ... zap.sh -cmd -autorun <plan>`,
      # mounting $GITHUB_WORKSPACE as the container's /zap/wrk -- so the plan
      # can reference .zap/scripts/bearer-session.js and write to
      # zap-reports/ using paths relative to the repo root, same as they
      # appear in .zap/full-scan.yaml.
      - name: ZAP full active scan (Automation Framework)
        uses: zaproxy/action-af@v0.3.0
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
          ZAP_SCANNER_EMAIL: ${{ secrets.ZAP_SCANNER_EMAIL }}
          ZAP_SCANNER_PASSWORD: ${{ secrets.ZAP_SCANNER_PASSWORD }}
        with:
          plan: ".zap/full-scan.yaml"
          docker_name: "ghcr.io/zaproxy/zaproxy:stable"
          docker_env_vars: |
            STAGING_URL
            ZAP_SCANNER_EMAIL
            ZAP_SCANNER_PASSWORD

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: zap-full-report
          path: zap-reports/
          retention-days: 90

      # New alerts above LOW open one GitHub issue per alert type (deduped by
      # a "Fingerprint: zap-alert-<pluginid>" marker in the issue body, so
      # re-running against unchanged staging doesn't pile up duplicates).
      # Runs even if the scan step reported failures (e.g. threshold
      # breaches) as long as the report was actually produced.
      - name: File findings as issues
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          report="zap-reports/zap-full-report.json"
          if [ ! -f "$report" ]; then
            echo "no report at $report -- scan didn't get far enough to produce one" >&2
            exit 0
          fi

          # One row per (pluginid, name), Medium/High risk only (riskcode 2 or 3).
          jq -r '
            [.site[]?.alerts[]? | select((.riskcode | tonumber) >= 2)]
            | group_by(.pluginid)
            | map(.[0])
            | .[]
            | [.pluginid, .name, .riskdesc, (.instances | length | tostring)]
            | @tsv
          ' "$report" | while IFS=$'\t' read -r pluginid name riskdesc instance_count; do
            fingerprint="zap-alert-${pluginid}"

            existing=$(gh issue list --state open --label security \
              --search "\"Fingerprint: ${fingerprint}\" in:body" \
              --json number --jq '.[0].number // empty')

            if [ -n "$existing" ]; then
              echo "skip pluginid=$pluginid ($name): already tracked as #$existing"
              continue
            fi

            body=$(printf '%s\n\n- **Risk**: %s\n- **Instances**: %s\n- **Run**: %s\n- **Report**: download the `zap-full-report` artifact from the run above for full request/response evidence.\n\nFingerprint: %s\n' \
              "Nightly ZAP full active scan against staging found this alert." \
              "$riskdesc" "$instance_count" "$RUN_URL" "$fingerprint")

            gh issue create \
              --title "[ZAP] ${name}" \
              --label security \
              --body "$body"
            echo "filed new issue for pluginid=$pluginid ($name)"
          done
