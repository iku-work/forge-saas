# T-222: Maestro E2E flows for the mobile app (apps/mobile/.maestro/) against
# a real backend + MailHog, on a real iOS Simulator -- not per-PR, for two
# reasons: booting a simulator and producing a native build (expo run:ios)
# takes several minutes even before the flows themselves run, and unlike the
# web Playwright suite (T-220) this depends on Xcode/simctl, which only
# GitHub's macOS runners provide. Maestro Cloud was considered as a
# device-farm alternative to a locally booted Simulator -- skipped for now,
# see apps/mobile/README.md's "CI" section for why.
#
# Assumes GitHub's macos-14 runner image ships Docker (documented in
# actions/runner-images) so the same docker-compose stack ci.yml's
# zap-baseline job boots on ubuntu-latest can boot here too. If a future
# runner image drops that, this job's "Boot ephemeral stack" step is where
# it'll fail first.
name: Maestro Mobile E2E

# Schedule removed 2026-09-09. It had failed every night in the sample --
# under a minute each time, on a runner billed at 10x -- so it was buying
# noise, not coverage. The likely cause is the assumption in the header
# above: GitHub's macos-14 image no longer ships Docker, so the compose
# stack this needs cannot boot. Restore the `schedule:` block once a manual
# `workflow_dispatch` run goes green.
on:
  workflow_dispatch:

jobs:
  maestro-mobile:
    runs-on: macos-14
    timeout-minutes: 45

    # Fixes the compose network/project name so container ports (backend,
    # MailHog) are predictable regardless of the checkout directory name --
    # same reasoning as ci.yml's zap-baseline job.
    env:
      COMPOSE_PROJECT_NAME: forge-mobile-e2e

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # worker's send_email job shells out to this compiled CLI (T-106) --
      # docker-compose.yml bind-mounts dist/ in rather than building it
      # inside the (Python) worker image, so it must already exist on the
      # host, same as make dev's own dev target does locally.
      - name: Build email-templates CLI
        run: pnpm --filter "@forge/email-templates..." build

      # .env.test's EMAIL_BACKEND=resend would make every invitation email
      # attempt a real (and, with .env.test's dummy key, always-failing)
      # Resend API call instead of landing in MailHog -- .env.e2e is the
      # same fixture the e2e-web job (T-220, ci.yml) uses, which forces
      # EMAIL_BACKEND=smtp so verification/invitation emails actually reach
      # MailHog. See that file's own header comment for the full reasoning.
      - name: Copy E2E environment file
        working-directory: backend
        run: |
          cp .env.e2e .env
          node ../scripts/gen-test-secrets.mjs >> .env

      # Unlike a passive scan that never sends mail, deep-link.yaml's
      # invitation email only reaches MailHog if something actually
      # dequeues the "send_email" ARQ job -- that's the worker container,
      # not the backend API process (same reasoning as e2e-web's boot step).
      - name: Boot ephemeral stack (backend + worker + Postgres + Redis + MinIO + MailHog)
        run: docker compose up -d postgres redis minio minio-init mailhog backend worker

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 2
          done
          echo "backend did not become ready" >&2
          docker compose logs backend
          exit 1

      # Creates MOBILE_E2E_EMAIL (backend/app/core/seed.py) that login.yaml
      # and logout.yaml sign in with, and the "Mobile E2E" org
      # deep-link.yaml's setup script invites from.
      - name: Migrate + seed
        run: |
          docker compose exec -T backend python -m app.core.migrations
          docker compose exec -T backend python -m app.core.seed

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # "iPhone 15" is only a device *type* until something creates a
      # concrete simulator instance with that name -- Xcode/simctl only
      # pre-provisions instances for the newest few generations by default,
      # so a plain `simctl boot "iPhone 15"` silently fails once GitHub's
      # runner image moves its default Xcode past that point (discovered by
      # actually running this on a current macOS box, where only iPhone
      # 16/17-generation instances existed out of the box). Creating it
      # first makes this idempotent regardless of what's pre-provisioned.
      - name: Boot iOS Simulator
        run: |
          xcrun simctl list devices | grep -q '"iPhone 15"' || \
            xcrun simctl create "iPhone 15" "iPhone 15" \
              "$(xcrun simctl list runtimes | grep -o 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]*' | tail -1)"
          xcrun simctl boot "iPhone 15" 2>/dev/null || true
          xcrun simctl bootstatus "iPhone 15" -b

      # Release configuration embeds the JS bundle into the app binary, so
      # the flows below don't depend on a live Metro dev server -- --no-bundler
      # skips starting one. SENTRY_DISABLE_AUTO_UPLOAD is required: this repo
      # has no SENTRY_ORG/SENTRY_AUTH_TOKEN configured for this job, so the
      # Xcode build phase's debug-symbol upload otherwise fails the build
      # outright ("An organization ID or slug is required") on every run.
      - name: Build + install app on the Simulator
        working-directory: apps/mobile
        run: npx expo run:ios --configuration Release --no-bundler --device "iPhone 15"
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: "true"

      - name: Run Maestro flows
        working-directory: apps/mobile
        run: maestro test .maestro/ --format junit --output ../../maestro-report.xml

      - name: Upload Maestro report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-report
          path: maestro-report.xml
          retention-days: 30

      - name: Tear down stack
        if: always()
        run: docker compose down
