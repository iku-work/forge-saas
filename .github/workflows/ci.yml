name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Ruff (lint + format check)
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      # scripts/ too: backend/scripts/new_module.py (T-251) is a developer CLI
      # rather than app code, but it is the one thing that writes new app code,
      # so it gets the same bar.
      - name: Mypy --strict
        working-directory: backend
        run: mypy --strict app/ scripts/

      # T-252: every ADR carries a parseable status + date, docs/adr/README.md's
      # index still matches the files on disk, and every runbook has the
      # template's six headings. Pure Python over docs/ -- no services, nothing
      # to install beyond what this job already has -- so it rides along here
      # rather than earning a job of its own.
      - name: Docs shape check (ADRs + runbooks)
        working-directory: backend
        run: python scripts/check_docs.py

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend lint + type-check
        run: |
          pnpm lint
          pnpm type-check

      # T-231's own "Done when": zero unannotated physical-direction Tailwind
      # classes in packages/ui or apps/web. A plain grep can't tell a
      # deliberately-physical class (Radix's viewport-relative `side`
      # animations, a close button pinned to one corner) from an
      # accidental one, so this checks for an `rtl-ok: <reason>` comment
      # within a few lines above the match instead of failing outright --
      # still cheap enough that a dedicated eslint rule isn't worth
      # authoring, same reasoning as the data-testid grep above.
      - name: Enforce logical direction classes in packages/ui + apps/web (T-231)
        run: |
          python3 - <<'PY'
          import re, sys, pathlib

          PATTERN = re.compile(
              r"\b(ml-|mr-|pl-|pr-|left-[\d\[]|right-[\d\[]|text-left\b|text-right\b|"
              r"rounded-l[trb]?\b|rounded-r[trb]?\b|border-l\b|border-r\b)"
          )
          ROOTS = ["packages/ui/src", "apps/web/src"]
          violations = []
          for root in ROOTS:
              for path in pathlib.Path(root).rglob("*.tsx"):
                  if path.name.endswith((".stories.tsx", ".test.tsx")):
                      continue
                  lines = path.read_text().splitlines()
                  for i, line in enumerate(lines):
                      if PATTERN.search(line):
                          window = lines[max(0, i - 8):i + 1]
                          if not any("rtl-ok" in w for w in window):
                              violations.append(f"{path}:{i + 1}: {line.strip()}")
          if violations:
              print("Physical direction classes require ms-/me-/ps-/pe-/start-/end-/"
                    "text-start/text-end logical equivalents, or an 'rtl-ok: <reason>' "
                    "comment within a few lines above (T-231):")
              for v in violations:
                  print(f"  {v}")
              sys.exit(1)
          print("T-231: no unannotated physical direction classes found")
          PY

  test:
    needs: lint
    runs-on: ubuntu-latest

    # Same creds/DB-name baked into backend/.env.test, so that file can be
    # copied as-is to boot the live backend below — no per-step overrides.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      # app/core/db.py builds the engine at import time (_settings =
      # get_settings()), which runs the moment conftest.py is collected --
      # before any fixture gets a chance to monkeypatch env vars. The dummy
      # values in .env.test must already be on disk as backend/.env first.
      - name: Copy test environment file
        working-directory: backend
        run: cp .env.test .env

      # T-048's fixtures spin up their own Postgres/Redis via testcontainers
      # (Docker-in-Docker, available by default on GitHub-hosted runners) --
      # the services above are only for the live backend started below.
      - name: Backend tests (real Postgres + Redis via testcontainers)
        working-directory: backend
        run: pytest --cov=app --cov-fail-under=85 tests/ -x

      # T-251: tests/test_new_module_script.py checks the generator against a
      # scratch tree; this checks the claim that actually matters -- that a
      # module generated into the *real* checkout is lint-, type- and
      # test-clean with zero manual edits. mypy and pytest both need
      # `app.modules.zztest` to be genuinely importable, which is why this
      # can't be done in tmp_path.
      #
      # Runs after the suite above and deletes the module immediately, in the
      # same step: while zztest exists, `Item` is on the process-wide
      # SQLModel.metadata for anything that sweeps app.modules.* (the alembic
      # placeholder guard only covers the *un*generated scaffold, by design),
      # so leaving it in place would change what later steps see.
      - name: Module generator smoke (make new-module NAME=zztest)
        run: |
          set -e
          # Absolute, because the trap fires after the `cd backend` below.
          root="$(pwd)"
          cleanup() {
            rm -rf "$root/backend/app/modules/zztest" "$root/backend/tests/modules/test_zztest.py"
          }
          trap cleanup EXIT
          make new-module NAME=zztest
          if grep -rn "__MODULE_NAME__\|__ModelName__" \
               backend/app/modules/zztest backend/tests/modules/test_zztest.py; then
            echo "generated module still carries a placeholder" >&2
            exit 1
          fi
          cd backend
          ruff check app/modules/zztest tests/modules/test_zztest.py
          ruff format --check app/modules/zztest tests/modules/test_zztest.py
          mypy --strict app/modules/zztest
          pytest tests/modules/test_zztest.py --no-cov -q

      - name: Module generator rejects bad names
        working-directory: backend
        run: |
          set -e
          for name in "" "Foo-Bar" "auth"; do
            # stderr captured, stdout discarded: a refusal that exits non-zero
            # but says nothing is as unhelpful as one that silently succeeds.
            if message=$(python scripts/new_module.py "$name" 2>&1 >/dev/null); then
              echo "NAME='$name' should have been refused" >&2
              exit 1
            fi
            test -n "$message" || { echo "NAME='$name' failed silently" >&2; exit 1; }
            echo "NAME='$name' -> $(printf '%s' "$message" | head -1)"
          done

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate test database
        working-directory: backend
        run: alembic upgrade head

      - name: Start backend
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 1
          done
          echo "backend did not become ready" >&2
          cat uvicorn.log
          exit 1

      - name: Generate API client from live OpenAPI schema
        run: pnpm --filter @forge/api-client generate

      - name: Build workspace packages
        run: pnpm build

      - name: Frontend tests
        run: pnpm --filter web test --run

      - name: i18n package tests
        run: pnpm --filter @forge/i18n test

      - name: Email templates package tests
        run: pnpm --filter @forge/email-templates test

      # --checks intentionally narrowed to match tests/contract/test_schemathesis.py
      # (T-050): this app never documents 401/403/404/409/429 in the OpenAPI
      # schema (§0.4), so status_code_conformance / positive_data_acceptance
      # would fail on every unauthenticated fuzz hit against a protected route.
      - name: Schemathesis live fuzz against running backend
        working-directory: backend
        run: |
          schemathesis run http://localhost:8000/openapi.json \
            --checks=not_a_server_error,response_schema_conformance \
            --suppress-health-check=filter_too_much \
            --max-examples=20

  storybook:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Same as the `build` job: client generation only needs /openapi.json,
      # which never touches the DB/Redis -- .env.test's dummy credentials are
      # enough to boot the app and serve the schema.
      - name: Start backend for OpenAPI schema
        working-directory: backend
        run: |
          pip install -e .
          cp .env.test .env
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 1
          done
          echo "backend did not become ready" >&2
          cat uvicorn.log
          exit 1

      - name: Generate API client from live OpenAPI schema
        run: pnpm --filter @forge/api-client generate

      - name: Build workspace packages
        run: pnpm build

      # test-storybook (T-150) drives Storybook through a real Chromium via
      # Playwright -- only chromium is installed since main.ts's a11y addon
      # only exercises stories in that one browser.
      - name: Install Playwright chromium
        run: pnpm --filter @forge/ui exec playwright install --with-deps chromium

      # turbo's own pipeline (turbo.json) makes storybook:test depend on
      # storybook:build depend on ^build, so this one command builds both
      # Storybooks, serves each, and runs test-storybook's a11y gate against
      # both -- same command verified locally via `pnpm storybook:test`.
      - name: Build + test-runner (a11y gate) for both Storybook instances
        run: pnpm storybook:test

      # Stand-in for a hosted preview URL until Chromatic (or another static
      # host) is wired up -- lets a reviewer download and open either build
      # locally from the Actions run without re-running the pipeline.
      - name: Upload packages/ui Storybook static build
        uses: actions/upload-artifact@v4
        with:
          name: storybook-ui
          path: packages/ui/storybook-static
          retention-days: 30

      - name: Upload packages/email-templates Storybook static build
        uses: actions/upload-artifact@v4
        with:
          name: storybook-email-templates
          path: packages/email-templates/storybook-static
          retention-days: 30

      # Phase 2 only configures Chromatic (T-150); Phase 3 wires the actual
      # visual-regression snapshots. Skips cleanly (not a failure) until
      # CHROMATIC_PROJECT_TOKEN is added to repo secrets.
      - name: Chromatic visual regression (packages/ui)
        if: ${{ secrets.CHROMATIC_PROJECT_TOKEN != '' }}
        uses: chromaui/action@latest
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        with:
          workingDir: packages/ui
          buildScriptName: storybook:build
          exitZeroOnChanges: true

  # T-244: docker-compose.prod.yml is the only stack where application traffic
  # actually goes through pgbouncer -- the dev stack and the testcontainers
  # fixtures in backend/tests both talk to Postgres directly. The driver-level
  # half of this (asyncpg's prepared statements vs. transaction pooling) is
  # covered by backend/tests/test_pgbouncer.py against a real pgbouncer; what
  # this job adds is the deployment wiring around it: the compose file's own
  # service graph, the healthcheck the backend's `depends_on` gates on, and
  # the two-DSN split between application traffic and migrations.
  pgbouncer-prod-compose:
    needs: lint
    runs-on: ubuntu-latest

    env:
      COMPOSE_PROJECT_NAME: forge-pgbouncer

    steps:
      - uses: actions/checkout@v4

      # The only edit made to the committed examples is the placeholder
      # password -- pool_mode, the reset query, auth type and pool sizing are
      # all exercised exactly as an operator would deploy them.
      - name: Materialise env files for the prod stack
        run: |
          cp backend/.env.prod-compose backend/.env
          sed 's/change-me/postgres/' .env.postgres.example > .env.postgres
          sed 's/change-me/postgres/' .env.pgbouncer.example > .env.pgbouncer
          cp .env.postgres-exporter.example .env.postgres-exporter

      # `up` blocks on the depends_on conditions, so reaching the next step at
      # all already proves pgbouncer passed a healthcheck that opens a real
      # pooled connection to Postgres. Caddy/worker/exporter are left out:
      # none of them are what this job is about.
      - name: Boot postgres + pgbouncer + redis + backend
        run: |
          docker compose -f docker-compose.prod.yml up -d --build \
            postgres pgbouncer redis backend

      - name: Wait for the backend (every query it makes goes through pgbouncer)
        run: |
          for i in $(seq 1 30); do
            docker compose -f docker-compose.prod.yml exec -T backend \
              python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" \
              && exit 0
            sleep 2
          done
          echo "backend did not become ready" >&2
          docker compose -f docker-compose.prod.yml logs backend pgbouncer
          exit 1

      # Runs while the app above is up and serving through the pooler --
      # that's the production upgrade path, not a convenience ordering.
      # Succeeding here means alembic reached Postgres over
      # MIGRATIONS_DATABASE_URL: session-level advisory locks and
      # multi-statement DDL do not survive transaction pooling.
      - name: Migrate over the direct DSN while pooled traffic flows
        run: docker compose -f docker-compose.prod.yml exec -T backend python -m app.core.migrations

      - name: pgbouncer is actually pooling, in transaction mode
        run: |
          docker compose -f docker-compose.prod.yml exec -T pgbouncer sh -c \
            'psql -h 127.0.0.1 -p 6432 -U "$DB_USER" -d pgbouncer -tAc "SHOW POOLS"' \
            | tee pools.txt
          grep -q "^forge|" pools.txt || { echo "app never opened a pooled connection" >&2; exit 1; }
          grep -q "|transaction|" pools.txt || { echo "pool_mode is not transaction" >&2; exit 1; }

      - name: /health/ready 200, repeated queries, two sequential transactions
        run: |
          docker compose -f docker-compose.prod.yml exec -T backend python - <<'PY'
          import json, urllib.request, urllib.error, uuid

          BASE = "http://localhost:8000"

          def post(path, payload):
              request = urllib.request.Request(
                  BASE + path, data=json.dumps(payload).encode(),
                  headers={"Content-Type": "application/json"}, method="POST")
              try:
                  with urllib.request.urlopen(request) as response:
                      return response.status
              except urllib.error.HTTPError as exc:
                  return exc.code

          # Repeated identical queries across the whole client pool: with
          # asyncpg's default statement handling this is where transaction
          # pooling raises InvalidSQLStatementNameError /
          # DuplicatePreparedStatementError.
          statuses = set()
          for _ in range(60):
              with urllib.request.urlopen(BASE + "/health/ready") as response:
                  statuses.add(response.status)
          assert statuses == {200}, f"/health/ready returned {statuses}"

          # A request that opens two sequential transactions (user insert +
          # commit, then the follow-up writes), then a second request reusing
          # the pool. 401 on login is the app's own unverified-email path --
          # it still proves the pooled read/write round trip worked.
          email = f"pgbouncer-{uuid.uuid4().hex[:8]}@example.com"
          assert post("/api/v1/auth/register", {"email": email, "password": "Correct-Horse9x"}) == 200
          assert post("/api/v1/auth/login", {"email": email, "password": "Correct-Horse9x"}) in (200, 401)
          print("pooled traffic OK")
          PY

      - name: No prepared-statement errors reached the application
        run: |
          if docker compose -f docker-compose.prod.yml logs backend \
            | grep -iE "InvalidSQLStatementName|DuplicatePreparedStatement|prepared statement"; then
            echo "prepared-statement error through pgbouncer -- see app/core/db.py build_connect_args" >&2
            exit 1
          fi

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v

  security:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # trufflehog/gitleaks scan full git history, not just the latest commit

      # Secret- and dependency-file scanners run first, against the bare
      # checkout, before any install step can drop node_modules/.venv on
      # disk -- those are .gitignored (never scanned in real CI) but would
      # otherwise flood a filesystem-walking scanner with third-party-package
      # false positives and slow the scan down for no benefit.
      - name: Install trufflehog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin v3.95.6

      # --exclude-paths: backend/.env.test is a committed test fixture with a
      # structurally-valid but never-deployed dummy RS256 keypair + Fernet key
      # (Settings() needs real-shaped key material to construct in tests).
      - name: Trufflehog (git history secret scan)
        run: |
          trufflehog git file://. --fail --no-update \
            --exclude-paths .trufflehog-exclude.txt

      - name: Install gitleaks
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks

      # --no-git: scans the working tree directly rather than git history --
      # .gitleaks.toml allowlists the same known test fixtures as trufflehog
      # above, plus .secrets.baseline (detect-secrets' own file, which stores
      # secret *hashes* that read as high-entropy strings to other scanners).
      - name: Gitleaks (working-tree secret scan)
        run: gitleaks detect --no-git --config .gitleaks.toml

      - name: Get current date for trivy DB cache key
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache trivy vulnerability DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.date.outputs.date }}
          restore-keys: trivy-db-

      - name: Install trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.71.2

      - name: Trivy filesystem scan (deps + secrets, high+ severity)
        run: trivy fs . --exit-code 1 --severity HIGH,CRITICAL --skip-dirs node_modules

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Bandit (medium+ severity)
        working-directory: backend
        run: bandit -r app/ -ll

      - name: Cache semgrep registry rules
        uses: actions/cache@v4
        with:
          path: ~/.cache/semgrep
          key: semgrep-${{ hashFiles('backend/semgrep/**') }}
          restore-keys: semgrep-

      # --config semgrep/ adds the project's own rules (no-os-environ,
      # no-mass-assign, no-plaintext-secret-column) on top of the community
      # registry ruleset.
      - name: Semgrep (community + project custom rules)
        working-directory: backend
        run: semgrep --config auto --config semgrep/ --error app/

      # --skip-editable: forge-saas-backend itself is installed editable and
      # isn't a published package: there's nothing on PyPI/OSV to audit it
      # against, and pip-audit treats an unaudited package as a hard failure
      # otherwise. Real findings in third-party deps still fail this step.
      - name: pip-audit (Python dependency CVEs)
        working-directory: backend
        run: pip-audit --skip-editable

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (Node dependency CVEs, high+ severity)
        run: pnpm audit --audit-level=high

  build:
    needs: [test, security]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Client generation only needs /openapi.json, which never touches the
      # DB/Redis -- .env.test's dummy credentials (same fixture the lint/test
      # jobs use) are enough to boot the app and serve the schema.
      - name: Start backend for OpenAPI schema
        working-directory: backend
        run: |
          pip install -e .
          cp .env.test .env
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 1
          done
          echo "backend did not become ready" >&2
          cat uvicorn.log
          exit 1

      - name: Generate API client from live OpenAPI schema
        run: pnpm --filter @forge/api-client generate

      - name: turbo build — gen-client output feeds every package/app build
        run: pnpm build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            --label "git-sha=$GITHUB_SHA" \
            -t "$IMAGE:$GITHUB_SHA" \
            -f backend/Dockerfile \
            .

      - name: Get current date for trivy DB cache key
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache trivy vulnerability DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.date.outputs.date }}
          restore-keys: trivy-db-

      - name: Install trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.71.2

      - name: Trivy image scan (high+ severity)
        run: trivy image "$IMAGE:$GITHUB_SHA" --exit-code 1 --severity HIGH,CRITICAL

      # T-225/ASVS V14.2.5: a CycloneDX SBOM of the exact image being
      # shipped -- every Python (pip) and Node (pnpm, via the
      # email-templates-builder stage baked into the runtime image) package,
      # not just top-level deps.
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: "${{ env.IMAGE }}:${{ github.sha }}"
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json
          retention-days: 90

      # Pushed only once the scan above passes -- a vulnerable image never
      # reaches the registry the deploy job pulls from.
      - name: Push image
        run: docker push "$IMAGE:$GITHUB_SHA"

  # T-210: passive DAST pass against a real running instance of the app --
  # boots the same dev stack `make dev` does (minus the worker, which this
  # passive HTTP scan never exercises) and scans it through Caddy, not the
  # bare backend, so TLS termination and security headers are actually in
  # the request path being tested.
  zap-baseline:
    needs: build
    runs-on: ubuntu-latest

    # Fixes the compose network name (<project>_forge-net) so the ZAP
    # container below can join it by a known name regardless of what the
    # checkout directory happens to be called on the runner.
    env:
      COMPOSE_PROJECT_NAME: forge-ci

    steps:
      - uses: actions/checkout@v4

      - name: Copy test environment file
        working-directory: backend
        run: cp .env.test .env

      - name: Boot ephemeral stack (backend + Caddy + Postgres + Redis + MinIO + Mailhog)
        run: docker compose up -d postgres redis minio minio-init mailhog backend caddy

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 2
          done
          echo "backend did not become ready" >&2
          docker compose logs backend
          exit 1

      - name: Migrate + seed
        run: |
          docker compose exec -T backend python -m app.core.migrations
          docker compose exec -T backend python -m app.core.seed

      # Confirms the request actually reaches the backend *through* Caddy
      # (TLS termination, security headers, the lot) before handing the URL
      # to ZAP -- catches a broken proxy config before blaming the scanner.
      - name: Wait for readiness through Caddy
        run: |
          for i in $(seq 1 30); do
            curl -sfk https://localhost/health/ready && exit 0
            sleep 2
          done
          echo "caddy/backend did not report ready" >&2
          docker compose logs caddy backend
          exit 1

      # Runs as a container on forge-net rather than against the published
      # host ports, and targets https://caddy (not localhost) -- "caddy" is
      # this container's own service name on that network via compose's
      # embedded DNS; "localhost" from inside the ZAP container would only
      # ever resolve to itself. See the Caddyfile comment for why the site
      # block also matches that hostname.
      - name: ZAP baseline scan
        run: |
          docker run --rm \
            --network ${{ env.COMPOSE_PROJECT_NAME }}_forge-net \
            -v "$(pwd)/.zap:/zap/wrk:rw" \
            -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t https://caddy -c baseline.conf -r zap-report.html

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: .zap/zap-report.html
          retention-days: 30

      - name: Tear down stack
        if: always()
        run: docker compose down -v

  # T-220: the Phase 1 acceptance journey (signup -> verify -> invite ->
  # upgrade), driven by a real browser against the same dev stack
  # zap-baseline boots -- see that job's own comments for the shared
  # compose/Caddy conventions. Chromium + WebKit, per playwright.config.ts.
  e2e-web:
    needs: build
    runs-on: ubuntu-latest

    env:
      COMPOSE_PROJECT_NAME: forge-e2e

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Client generation only needs /openapi.json -- same host-side boot as
      # the build job above, torn down again before docker compose's own
      # backend container needs port 8000.
      - name: Start backend for OpenAPI schema
        working-directory: backend
        run: |
          pip install -e .
          cp .env.test .env
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &
          echo $! > uvicorn.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 1
          done
          echo "backend did not become ready" >&2
          cat uvicorn.log
          exit 1

      - name: Generate API client from live OpenAPI schema
        run: pnpm --filter @forge/api-client generate

      # Produces apps/web/dist, which Caddy bind-mounts (docker-compose.yml's
      # caddy service) once the compose stack boots below. VITE_API_URL=
      # (empty, not unset) makes @forge/api-client's getApiBaseUrl() return
      # "" instead of its http://localhost:8000 dev-server-only fallback --
      # without it, the built SPA calls the backend cross-origin from
      # https://localhost, and the browser silently refuses to persist the
      # __Host-refresh_token cookie (Secure requires the *response* to have
      # come over HTTPS too), breaking session persistence across any full
      # page navigation. A relative base URL keeps every API call same-origin
      # through Caddy, matching how this stack is actually served here.
      - name: turbo build — produces apps/web/dist
        run: pnpm build
        env:
          VITE_API_URL: ""

      - name: Stop host-side backend
        working-directory: backend
        run: kill "$(cat uvicorn.pid)" || true

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium webkit

      # T-220's own "Done when": zero non-data-testid selectors in the E2E
      # suite. Cheap enough as a grep that a dedicated eslint rule isn't
      # worth authoring.
      - name: Enforce data-testid-only selectors in e2e specs
        run: |
          if grep -rnE "getByRole\(|getByText\(|getByLabel\(|getByPlaceholder\(|getByAltText\(|getByTitle\(|\.locator\(\s*[\"'](?!\[data-testid=)" apps/web/e2e; then
            echo "Only data-testid selectors are allowed in apps/web/e2e (T-220)" >&2
            exit 1
          fi

      - name: Copy E2E environment file
        working-directory: backend
        run: cp .env.e2e .env

      # Unlike zap-baseline's passive HTTP scan (which never exercises it),
      # this suite's verification/invitation emails only reach MailHog if
      # something actually dequeues the "send_email" ARQ job -- that's the
      # worker container, not the backend API process.
      - name: Boot ephemeral stack (backend + worker + Caddy + Postgres + Redis + MinIO + Mailhog)
        run: docker compose up -d postgres redis minio minio-init mailhog backend worker caddy

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 2
          done
          echo "backend did not become ready" >&2
          docker compose logs backend
          exit 1

      - name: Migrate + seed
        run: |
          docker compose exec -T backend python -m app.core.migrations
          docker compose exec -T backend python -m app.core.seed

      # Confirms the SPA is actually reachable through Caddy (not just the
      # backend's own /health) before handing off to Playwright.
      - name: Wait for the app through Caddy
        run: |
          for i in $(seq 1 30); do
            curl -sfk https://localhost/health/ready && exit 0
            sleep 2
          done
          echo "caddy/backend did not report ready" >&2
          docker compose logs caddy backend
          exit 1

      - name: Run Playwright (chromium + webkit)
        working-directory: apps/web
        run: pnpm e2e
        env:
          CI: "true"

      - name: Upload Playwright report + traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 30

      - name: Tear down stack
        if: always()
        run: docker compose down -v

  # Dormant until RENDER_API_KEY / RENDER_BACKEND_SERVICE_ID /
  # RENDER_WORKER_SERVICE_ID / PROD_ENV_FILE / PROD_DATABASE_URL / PROD_DOMAIN
  # secrets are configured on the repo (see docs/runbooks/deploy-render.md).
  # Until then this job simply fails fast on the first curl, on push to main.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      packages: read

    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write production .env (Settings() needs every required field, not just DATABASE_URL)
        run: printf '%s' "${{ secrets.PROD_ENV_FILE }}" > prod.env

      # T-225/ASVS V12.4.2: app.core.config.Settings itself already refuses
      # to boot with VIRUS_SCANNER=noop outside dev, but that failure would
      # only surface as a crash-looping Render service *after* the deploy
      # below -- catching it here fails fast, before migrations even run,
      # against the exact env file the deploy is about to ship.
      - name: Guard against VIRUS_SCANNER=noop in production
        run: |
          if grep -qE '^VIRUS_SCANNER=noop$' prod.env; then
            echo "PROD_ENV_FILE sets VIRUS_SCANNER=noop -- uploaded files would never be scanned. Refusing to deploy." >&2
            exit 1
          fi

      # Same image that was scanned + pushed in `build` -- never reinstalled
      # from source, so what ran migrations is byte-for-byte what gets deployed.
      - name: Run migrations against production DB (fail = abort, no deploy)
        run: docker run --rm --env-file prod.env "$IMAGE" alembic upgrade head

      - name: Capture currently-live deploy (rollback target if the new one fails)
        id: previous
        run: |
          DEPLOY_ID=$(curl -sf -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_BACKEND_SERVICE_ID }}/deploys?status=live&limit=1" \
            | jq -r '.[0] | (.deploy // .) | .id')
          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"

      - name: Trigger Render deploy — backend
        id: deploy_backend
        run: |
          DEPLOY_ID=$(curl -sf -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_BACKEND_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"imageUrl\": \"$IMAGE\"}" | jq -r '.id')
          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"

      - name: Trigger Render deploy — worker
        run: |
          curl -sf -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_WORKER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"imageUrl\": \"$IMAGE\"}"

      # Render keeps the previous deploy serving traffic until the new one
      # reports "live" -- this makes that health gate visible in CI rather
      # than trusting it silently.
      - name: Wait for backend health gate
        run: |
          for i in $(seq 1 60); do
            STATUS=$(curl -sf -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              "https://api.render.com/v1/services/${{ secrets.RENDER_BACKEND_SERVICE_ID }}/deploys/${{ steps.deploy_backend.outputs.deploy_id }}" \
              | jq -r '.status')
            echo "deploy status: $STATUS"
            [ "$STATUS" = "live" ] && exit 0
            case "$STATUS" in *failed*|canceled) exit 1 ;; esac
            sleep 5
          done
          echo "timed out waiting for deploy to go live" >&2
          exit 1

      - name: Smoke test
        id: smoke_test
        run: curl -sf "https://${{ secrets.PROD_DOMAIN }}/health/ready"

      - name: Roll back to previous deploy
        if: failure() && steps.smoke_test.outcome == 'failure'
        run: |
          curl -sf -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_BACKEND_SERVICE_ID }}/rollback" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"deployId\": \"${{ steps.previous.outputs.deploy_id }}\"}"

      # E2E (Playwright) against staging lands in T-220 (Phase 3) -- no
      # Playwright project exists in this repo yet, so this step is
      # intentionally not wired up until then.
