name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    # Read once here and consumed by `lighthouse` below as a job-level `if:`.
    # A job condition cannot run code, so the value has to come from a job
    # that already ran -- and this is the first one, already installs the
    # frontend dependencies jiti needs to read a TypeScript config, and is a
    # `needs:` of everything downstream anyway. The alternative was a whole
    # extra runner whose only output is one boolean.
    outputs:
      marketing: ${{ steps.marketing-toggle.outputs.enabled }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Ruff (lint + format check)
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      # scripts/ too: backend/scripts/new_module.py (T-251) is a developer CLI
      # rather than app code, but it is the one thing that writes new app code,
      # so it gets the same bar.
      - name: Mypy --strict
        working-directory: backend
        run: mypy --strict app/ scripts/

      # T-252: every ADR carries a parseable status + date, docs/adr/README.md's
      # index still matches the files on disk, and every runbook has the
      # template's six headings. Pure Python over docs/ -- no services, nothing
      # to install beyond what this job already has -- so it rides along here
      # rather than earning a job of its own.
      - name: Docs shape check (ADRs + runbooks)
        working-directory: backend
        run: python scripts/check_docs.py

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Through apps/marketing's own reader rather than by grepping
      # product.config.ts: the same function `astro build` consults to decide
      # whether there is a marketing site at all decides whether there is one
      # to measure. A regex could not tell `marketing: true` in the modules
      # block from the same string in a comment -- the argument the
      # module-matrix job below already makes for reading a config instead of
      # matching text in one.
      - name: Read the marketing module toggle (T-306)
        id: marketing-toggle
        run: |
          enabled=$(node --input-type=module -e '
            import { readMarketingEnabled } from "./apps/marketing/scripts/guard-enabled.mjs";
            console.log(await readMarketingEnabled());
          ')
          echo "marketing enabled: $enabled"
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

      # packages/api-client/src/generated/ is gitignored (it is derived from
      # the OpenAPI schema), so on a fresh checkout @forge/api-client cannot
      # build -- and `pnpm lint`/`type-check` both depend on `^build` via
      # turbo. T-313 made that derivation offline: no uvicorn, no port to
      # poll, and every module's symbols present regardless of what
      # product/config.py enables.
      - name: Generate API client from the OpenAPI schema
        run: pnpm --filter @forge/api-client generate

      - name: Frontend lint + type-check
        run: |
          pnpm lint
          pnpm type-check

      # T-231's own "Done when": zero unannotated physical-direction Tailwind
      # classes in packages/ui or apps/web. A plain grep can't tell a
      # deliberately-physical class (Radix's viewport-relative `side`
      # animations, a close button pinned to one corner) from an
      # accidental one, so this checks for an `rtl-ok: <reason>` comment
      # within a few lines above the match instead of failing outright --
      # still cheap enough that a dedicated eslint rule isn't worth
      # authoring, same reasoning as the data-testid grep above.
      - name: Enforce logical direction classes in packages/ui + apps/web (T-231)
        run: |
          python3 - <<'PY'
          import re, sys, pathlib

          PATTERN = re.compile(
              r"\b(ml-|mr-|pl-|pr-|left-[\d\[]|right-[\d\[]|text-left\b|text-right\b|"
              r"rounded-l[trb]?\b|rounded-r[trb]?\b|border-l\b|border-r\b)"
          )
          ROOTS = ["packages/ui/src", "apps/web/src"]
          violations = []
          for root in ROOTS:
              for path in pathlib.Path(root).rglob("*.tsx"):
                  if path.name.endswith((".stories.tsx", ".test.tsx")):
                      continue
                  lines = path.read_text().splitlines()
                  for i, line in enumerate(lines):
                      if PATTERN.search(line):
                          window = lines[max(0, i - 8):i + 1]
                          if not any("rtl-ok" in w for w in window):
                              violations.append(f"{path}:{i + 1}: {line.strip()}")
          if violations:
              print("Physical direction classes require ms-/me-/ps-/pe-/start-/end-/"
                    "text-start/text-end logical equivalents, or an 'rtl-ok: <reason>' "
                    "comment within a few lines above (T-231):")
              for v in violations:
                  print(f"  {v}")
              sys.exit(1)
          print("T-231: no unannotated physical direction classes found")
          PY

  test:
    needs: lint
    runs-on: ubuntu-latest

    # Same creds/DB-name baked into backend/.env.test, so that file can be
    # copied as-is to boot the live backend below — no per-step overrides.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      # app/core/db.py builds the engine at import time (_settings =
      # get_settings()), which runs the moment conftest.py is collected --
      # before any fixture gets a chance to monkeypatch env vars. The dummy
      # values in .env.test must already be on disk as backend/.env first.
      - name: Copy test environment file
        working-directory: backend
        run: cp .env.test .env

      # T-048's fixtures spin up their own Postgres/Redis via testcontainers
      # (Docker-in-Docker, available by default on GitHub-hosted runners) --
      # the services above are only for the live backend started below.
      - name: Backend tests (real Postgres + Redis via testcontainers)
        working-directory: backend
        run: pytest --cov=app --cov-fail-under=85 tests/ -x

      # T-251: tests/test_new_module_script.py checks the generator against a
      # scratch tree; this checks the claim that actually matters -- that a
      # module generated into the *real* checkout is lint-, type- and
      # test-clean with zero manual edits. mypy and pytest both need
      # `app.modules.zztest` to be genuinely importable, which is why this
      # can't be done in tmp_path.
      #
      # Runs after the suite above and deletes the module immediately, in the
      # same step: while zztest exists, `Item` is on the process-wide
      # SQLModel.metadata for anything that sweeps app.modules.* (the alembic
      # placeholder guard only covers the *un*generated scaffold, by design),
      # so leaving it in place would change what later steps see.
      - name: Module generator smoke (make new-module NAME=zztest)
        run: |
          set -e
          # Absolute, because the trap fires after the `cd backend` below.
          root="$(pwd)"
          cleanup() {
            rm -rf "$root/backend/app/modules/zztest" "$root/backend/tests/modules/test_zztest.py"
          }
          trap cleanup EXIT
          make new-module NAME=zztest
          if grep -rn "__MODULE_NAME__\|__ModelName__" \
               backend/app/modules/zztest backend/tests/modules/test_zztest.py; then
            echo "generated module still carries a placeholder" >&2
            exit 1
          fi
          cd backend
          ruff check app/modules/zztest tests/modules/test_zztest.py
          ruff format --check app/modules/zztest tests/modules/test_zztest.py
          mypy --strict app/modules/zztest
          pytest tests/modules/test_zztest.py --no-cov -q

      - name: Module generator rejects bad names
        working-directory: backend
        run: |
          set -e
          for name in "" "Foo-Bar" "auth"; do
            # stderr captured, stdout discarded: a refusal that exits non-zero
            # but says nothing is as unhelpful as one that silently succeeds.
            if message=$(python scripts/new_module.py "$name" 2>&1 >/dev/null); then
              echo "NAME='$name' should have been refused" >&2
              exit 1
            fi
            test -n "$message" || { echo "NAME='$name' failed silently" >&2; exit 1; }
            echo "NAME='$name' -> $(printf '%s' "$message" | head -1)"
          done

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # `python -m app.core.migrations`, not `alembic upgrade head`: every
      # optional module's migrations sit on their own branch (T-062), so this
      # tree always has several heads and a bare `head` is ambiguous -- alembic
      # refuses with "Multiple head revisions are present". That module walks
      # migration_targets() instead, applying the core trunk plus exactly the
      # branches product/config.py enables, which is also what `make migrate`
      # runs.
      - name: Migrate test database
        working-directory: backend
        run: python -m app.core.migrations

      - name: Start backend
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 1
          done
          echo "backend did not become ready" >&2
          cat uvicorn.log
          exit 1

      # Offline (T-313), from an all-modules-on build -- the backend booted
      # above is for the schemathesis fuzz at the end of this job, not for
      # this step.
      - name: Generate API client from the OpenAPI schema
        run: pnpm --filter @forge/api-client generate

      - name: Build workspace packages
        run: pnpm build

      - name: Frontend tests
        run: pnpm --filter web test --run

      - name: Marketing site tests
        # Runs a real `astro build` per case and asserts over dist/ -- the
        # zero-JavaScript landing page, the hydrated island, and the module
        # guard. It rebuilds apps/marketing/dist itself, so it neither needs
        # nor disturbs the `pnpm build` above.
        #
        # Two cases in tests/caddy.test.ts additionally run `caddy validate`
        # in a container over the real Caddyfiles and the site block T-307's
        # build generates -- string matching cannot tell you whether Caddy
        # would actually load a config. They skip themselves when no Docker
        # daemon answers, which is a developer machine, not this runner.
        run: pnpm --filter marketing test

      - name: i18n package tests
        run: pnpm --filter @forge/i18n test

      - name: Email templates package tests
        run: pnpm --filter @forge/email-templates test

      # --checks intentionally narrowed to match tests/contract/test_schemathesis.py
      # (T-050): this app never documents 401/403/404/409/429 in the OpenAPI
      # schema (§0.4), so status_code_conformance / positive_data_acceptance
      # would fail on every unauthenticated fuzz hit against a protected route.
      #
      # --phases=coverage (T-350), which is the *deterministic* pass: it walks
      # each operation's parameters and constraint boundaries systematically
      # rather than sampling randomly. 1467 cases over 73 operations, and the
      # same answer every run.
      #
      # The randomised `fuzzing` phase is deliberately not run here, and the
      # reason is worth recording because two attempts at the other fix
      # failed. That phase reported "2564 generated, 2564 passed" -- every
      # contract assertion held -- and exited 1 anyway on four Hypothesis
      # *health checks*, which say a generator is inefficient (too many
      # examples filtered out for a path parameter with a tight pattern), not
      # that the API is wrong. Neither `--suppress-health-check=filter_too_much`
      # (already in place when it first went red) nor `=all` prevented it; the
      # CLI accepts both and the checks fire regardless. It has never been
      # reproducible outside CI either: same version, same `--seed`, same 2564
      # cases, green locally.
      #
      # Nothing is lost that this repo does not already have. Randomised
      # fuzzing of the same schema runs in tests/contract/test_schemathesis.py
      # in this same job, *authenticated* -- which matters, because the CLI
      # runs unauthenticated and 39 of its operations only ever saw 401/403.
      # What the CLI adds is a pass over real HTTP against a real uvicorn
      # rather than ASGI in-process, and the coverage phase delivers that.
      - name: Schemathesis contract pass against running backend
        working-directory: backend
        run: |
          schemathesis run http://localhost:8000/openapi.json \
            --checks=not_a_server_error,response_schema_conformance \
            --phases=coverage \
            --max-examples=20

  # T-291: the half of the module matrix that cannot run in-process.
  #
  # backend/tests/modules/test_module_toggles.py already parametrises module
  # configurations by monkeypatching get_modules(), and it runs in the `test`
  # job above. What it cannot reach is everything outside a single Python
  # process: a real `alembic upgrade` from an empty database, app boot as a
  # subprocess reading an actual product/config.py off disk, and the frontend
  # build -- which from T-300 onward is gated by a module toggle of its own
  # (`marketing` switches off a *build*, not a router).
  #
  # Three combinations, each a whole-repo run. B is the one that earns the
  # job: "every optional module off" is the configuration a template user is
  # most likely to want and least likely to have been tested.
  module-matrix:
    needs: test
    runs-on: ubuntu-latest

    name: module-matrix (${{ matrix.id }})

    strategy:
      # Independent configurations: knowing that B is broken is not a reason
      # to stop finding out about C.
      fail-fast: false
      matrix:
        include:
          # A copies nothing on purpose. This is a template: a product edits
          # backend/product/config.py, and that edited file is what has to
          # boot and build. A committed "default" fixture would test the
          # template's opinion instead of the product's.
          - id: a-default
            fixture: ""
          - id: b-minimal
            fixture: minimal
          - id: c-phase4
            fixture: phase4

    # Same creds/DB name as backend/.env.test, exactly like the `test` job --
    # forge_test starts empty, which is what makes the migrate step below a
    # from-zero upgrade rather than an incremental one.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Copy test environment file
        working-directory: backend
        run: cp .env.test .env

      # Deliberately *before* the fixture is applied, and identical in every
      # combination -- but for a reason that changed in T-313. The schema is
      # now dumped offline with *every* module enabled
      # (backend/scripts/dump_openapi.py), so the generated client is the
      # union of every configuration rather than a picture of one, and
      # apps/web can go on importing its symbols unconditionally (the SPA
      # gates modules at runtime from /api/v1/config, not at compile time).
      # That also retired the second uvicorn this job used to start and stop
      # on :8000 purely to serve a schema, and the start-order race that came
      # with it.
      - name: Generate API client from the OpenAPI schema
        run: pnpm --filter @forge/api-client generate

      # Both files, always together: a half-applied toggle (backend 404s, UI
      # still offers the page) is the exact failure the runbook warns about,
      # and the matrix would hide it by only ever changing one side.
      # tests/test_product_config_parity.py has already proven the pair agrees
      # before this job gets anywhere near a container.
      - name: Apply the ${{ matrix.id }} module fixture
        if: matrix.fixture != ''
        run: |
          cp "backend/tests/fixtures/module_configs/${{ matrix.fixture }}.py" backend/product/config.py
          cp "backend/tests/fixtures/module_configs/${{ matrix.fixture }}.config.ts" product.config.ts

      - name: Migration plan for this combination
        working-directory: backend
        run: python -m app.core.migrations plan

      # migration_targets() asks Alembic only for the branches this
      # combination enables; a branch nobody asks for is never recorded in
      # alembic_version. Against the empty forge_test above, this is the
      # from-scratch upgrade a new deployment of this product would run.
      - name: alembic upgrade from an empty database
        working-directory: backend
        run: python -m app.core.migrations

      # A subprocess, not TestClient: this is the only check that
      # product/config.py on disk -- not a monkeypatched module object --
      # boots the real app, with validate_modules() and validate_stripe_keys()
      # running for real.
      - name: Boot the app as a subprocess
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 1
          done
          echo "backend did not boot under the ${{ matrix.id }} module config" >&2
          cat uvicorn.log
          exit 1

      - name: /api/v1/config reports exactly this combination's modules
        working-directory: backend
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from typing import get_args

          from app.core.modules import ModuleName
          from product.config import MODULES

          with urllib.request.urlopen("http://localhost:8000/api/v1/config") as response:
              reported = json.load(response)["data"]["modules"]

          expected = {name: getattr(MODULES, name).enabled for name in get_args(ModuleName)}
          print(json.dumps(reported, indent=2, sort_keys=True))
          assert reported == expected, f"/config disagrees with product/config.py: {reported} != {expected}"
          PY

      # --no-cov: the suite is deliberately narrowed here, so the 85% gate the
      # `test` job enforces over the *whole* suite would be measuring a
      # different thing. `module_dependent` marks the tests that need an
      # optional module's routes, tables or seed rows -- see pyproject.toml's
      # marker description. Combination B is the one that needs the
      # deselection; A and C run the same command for comparability, and the
      # `test` job above still runs everything at the committed config.
      #
      # test_module_toggles.py is *not* module_dependent (it supplies its own
      # configuration), so it runs here too -- which is what makes
      # unconditionalising a router import in build_router() turn B red.
      - name: Backend tests that do not require an optional module
        working-directory: backend
        run: pytest -m "not module_dependent" --no-cov tests/

      - name: Frontend build, lint and type-check
        run: |
          pnpm build
          pnpm lint
          pnpm type-check

      # T-300 creates apps/marketing and its scripts/guard-enabled.mjs, which
      # reads modules.marketing from product.config.ts and exits 0 without
      # producing a dist when it is false. Until then there is nothing to
      # assert, and this step says so rather than passing silently. The moment
      # that app exists, the check below is what makes deleting the guard turn
      # combination B red.
      - name: The marketing build honours its toggle
        run: |
          if [ ! -d apps/marketing ]; then
            echo "apps/marketing does not exist yet (T-300) — nothing to check"
            exit 0
          fi
          # Read the toggle from the Python config rather than by grepping the
          # TypeScript one: the two are proven identical by
          # tests/test_product_config_parity.py, which ran in the pytest step
          # above against these very files, and a dataclass attribute cannot be
          # matched by accident the way `marketing: true` in a comment can.
          enabled=$(cd backend && python -c \
            "from product.config import MODULES; print(str(MODULES.marketing.enabled).lower())")
          if [ "$enabled" = "true" ] && [ ! -d apps/marketing/dist ]; then
            echo "marketing is enabled but pnpm build produced no apps/marketing/dist" >&2
            exit 1
          fi
          if [ "$enabled" = "false" ] && [ -d apps/marketing/dist ]; then
            echo "marketing is disabled but apps/marketing/dist was built anyway — is scripts/guard-enabled.mjs still wired into apps/marketing's build script?" >&2
            exit 1
          fi
          # T-307: and the generated Caddy site block goes with it. "Absent"
          # is the requirement, not "present and 404ing" -- the Caddyfile
          # imports the directory as a glob, so a missing file is a warning
          # in Caddy's log and an app host that is completely unaffected.
          blocks=$(ls apps/marketing/caddy/*/*.caddy 2>/dev/null | wc -l)
          if [ "$enabled" = "true" ] && [ "$blocks" -ne 2 ]; then
            echo "marketing is enabled but the build wrote $blocks Caddy site block(s), expected 2" >&2
            exit 1
          fi
          if [ "$enabled" = "false" ] && [ "$blocks" -ne 0 ]; then
            echo "marketing is disabled but $blocks Caddy site block(s) are still there — is scripts/guard-enabled.mjs still removing them?" >&2
            exit 1
          fi
          echo "marketing=$enabled, dist present: $([ -d apps/marketing/dist ] && echo yes || echo no), Caddy blocks: $blocks"

      # The other half of the same requirement, and the one a file listing
      # cannot make: that the *edge* still comes up. Caddy only -- no backend,
      # no database -- because what is being tested is the config it loads,
      # and `pnpm build` above has already produced the apps/web/dist it
      # serves. With combination B (marketing off) this is the case the task
      # names explicitly: the failure to avoid is a disabled marketing module
      # taking the product's own host down with it.
      - name: The edge boots and serves the app for this combination (T-307)
        run: |
          set -euo pipefail
          docker compose up -d --no-deps caddy
          for i in $(seq 1 30); do
            curl -sfk https://localhost/ -o /dev/null && break
            sleep 1
          done
          curl -sfk https://localhost/ | grep -q '<div id="root">'

          enabled=$(cd backend && python -c \
            "from product.config import MODULES; print(str(MODULES.marketing.enabled).lower())")
          status=$(curl -sk --resolve marketing.localhost:443:127.0.0.1 \
            -o /dev/null -w '%{http_code}' https://marketing.localhost/en/ || true)
          echo "marketing=$enabled, marketing host answered: $status"
          if [ "$enabled" = "true" ] && [ "$status" != "200" ]; then
            echo "marketing is enabled but its host did not serve /en/" >&2
            docker compose logs caddy
            exit 1
          fi
          if [ "$enabled" = "false" ] && [ "$status" = "200" ]; then
            echo "marketing is disabled but its host answered anyway" >&2
            docker compose logs caddy
            exit 1
          fi

      - name: Tear down the edge
        if: always()
        run: docker compose down -v

      # Same dance as the module-generator smoke in `test`: this job works
      # against a dirty checkout, so it puts the checkout back the way it
      # found it whether or not anything above failed. Nothing later in this
      # job reads the config files, but an artifact upload or a cache save
      # added tomorrow would, and it would silently capture combination B's.
      - name: Restore the product config files
        if: always()
        run: git checkout -- backend/product/config.py product.config.ts

  storybook:
    needs: lint
    runs-on: ubuntu-latest

    # Hoisted out of the Chromatic step below because a *step-level* `if:`
    # cannot see the `secrets` context -- only `env` (among others). Reading
    # the secret here, where the secrets context is available, and testing
    # `env.` in the condition is the supported way to write "skip this step
    # when the token isn't configured".
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # T-313: the document is dumped offline from an *all-modules-on* build
      # of the app (backend/scripts/dump_openapi.py) rather than fetched from a
      # running one. Nothing about producing a schema needs a port, a database
      # or a Redis, and the union of every module is what apps/web's runtime
      # module gating (from /api/v1/config, not at compile time) already
      # assumes -- one bundle serves every configuration, so the client it is
      # built against must contain every configuration's symbols.
      - name: Generate API client from the OpenAPI schema
        run: |
          pip install -e ./backend
          pnpm --filter @forge/api-client generate

      - name: Build workspace packages
        run: pnpm build

      # test-storybook (T-150) drives Storybook through a real Chromium via
      # Playwright -- only chromium is installed since main.ts's a11y addon
      # only exercises stories in that one browser.
      - name: Install Playwright chromium
        run: pnpm --filter @forge/ui exec playwright install --with-deps chromium

      # turbo's own pipeline (turbo.json) makes storybook:test depend on
      # storybook:build depend on ^build, so this one command builds both
      # Storybooks, serves each, and runs test-storybook's a11y gate against
      # both -- same command verified locally via `pnpm storybook:test`.
      - name: Build + test-runner (a11y gate) for both Storybook instances
        run: pnpm storybook:test

      # Stand-in for a hosted preview URL until Chromatic (or another static
      # host) is wired up -- lets a reviewer download and open either build
      # locally from the Actions run without re-running the pipeline.
      - name: Upload packages/ui Storybook static build
        uses: actions/upload-artifact@v4
        with:
          name: storybook-ui
          path: packages/ui/storybook-static
          retention-days: 30

      - name: Upload packages/email-templates Storybook static build
        uses: actions/upload-artifact@v4
        with:
          name: storybook-email-templates
          path: packages/email-templates/storybook-static
          retention-days: 30

      # Phase 2 only configures Chromatic (T-150); Phase 3 wires the actual
      # visual-regression snapshots. Skips cleanly (not a failure) until
      # CHROMATIC_PROJECT_TOKEN is added to repo secrets.
      - name: Chromatic visual regression (packages/ui)
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        uses: chromaui/action@latest
        with:
          workingDir: packages/ui
          buildScriptName: storybook:build
          exitZeroOnChanges: true

  # T-306: the marketing performance budget, enforced rather than screenshotted.
  #
  # Static output served by http-server, four real pages, three runs each,
  # asserted at the median -- no Docker, no backend, no database, because the
  # site is a directory of files. See apps/marketing/lighthouserc.cjs for the
  # thresholds and for why Total Blocking Time stands in for the plan's INP.
  #
  # Skipped as a *job* when the module is off: a product with
  # `modules.marketing: false` builds no dist/, and a Lighthouse run against an
  # empty directory is a red job about nothing. The condition reads the toggle
  # `lint` published; scripts/lighthouse.mjs checks the same thing again for
  # anyone running it by hand.
  #
  # The browser is the runner image's own Google Chrome -- pinning one here
  # would mean measuring whatever version happened to be vendored rather than
  # the one Lighthouse expects. `lhci` prints "Chrome installation found" in
  # its healthcheck, so a runner image that ever drops it says so by name.
  lighthouse:
    needs: lint
    if: needs.lint.outputs.marketing == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # T-313: the document is dumped offline from an *all-modules-on* build
      # of the app (backend/scripts/dump_openapi.py) rather than fetched from a
      # running one. Nothing about producing a schema needs a port, a database
      # or a Redis, and the union of every module is what apps/web's runtime
      # module gating (from /api/v1/config, not at compile time) already
      # assumes -- one bundle serves every configuration, so the client it is
      # built against must contain every configuration's symbols.
      - name: Generate API client from the OpenAPI schema
        run: |
          pip install -e ./backend
          pnpm --filter @forge/api-client generate

      - name: Build workspace packages
        run: pnpm build

      # Rebuilds apps/marketing itself, with PUBLIC_SITE_URL pinned to the
      # PRODUCTION_ORIGIN in src/config/indexing.ts -- without that the site
      # serves `Disallow: /` (T-304), Lighthouse's is-crawlable audit reads
      # robots.txt, and the SEO category scores 0.66 against a 0.95 assertion
      # on a build that is perfectly fine. The script owns that; see its
      # header.
      - name: Lighthouse budget (4 pages x 3 runs, median)
        run: pnpm --filter marketing lighthouse

      # The gate's own test. Injects one page that hydrates an island for no
      # reason, asserts the same budget against it, and fails if the budget
      # does *not* catch it on total-blocking-time and the performance score.
      # Without this the job goes green the day somebody stops asserting.
      - name: Lighthouse budget has teeth (regression fixture)
        run: pnpm --filter marketing lighthouse:fixture

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: apps/marketing/.lighthouseci
          retention-days: 30

  # T-244: docker-compose.prod.yml is the only stack where application traffic
  # actually goes through pgbouncer -- the dev stack and the testcontainers
  # fixtures in backend/tests both talk to Postgres directly. The driver-level
  # half of this (asyncpg's prepared statements vs. transaction pooling) is
  # covered by backend/tests/test_pgbouncer.py against a real pgbouncer; what
  # this job adds is the deployment wiring around it: the compose file's own
  # service graph, the healthcheck the backend's `depends_on` gates on, and
  # the two-DSN split between application traffic and migrations.
  pgbouncer-prod-compose:
    needs: lint
    runs-on: ubuntu-latest

    env:
      COMPOSE_PROJECT_NAME: forge-pgbouncer

    steps:
      - uses: actions/checkout@v4

      # The only edit made to the committed examples is the placeholder
      # password -- pool_mode, the reset query, auth type and pool sizing are
      # all exercised exactly as an operator would deploy them.
      - name: Materialise env files for the prod stack
        run: |
          cp backend/.env.prod-compose backend/.env
          sed 's/change-me/postgres/' .env.postgres.example > .env.postgres
          sed 's/change-me/postgres/' .env.pgbouncer.example > .env.pgbouncer
          cp .env.postgres-exporter.example .env.postgres-exporter

      # `up` blocks on the depends_on conditions, so reaching the next step at
      # all already proves pgbouncer passed a healthcheck that opens a real
      # pooled connection to Postgres. Caddy/worker/exporter are left out:
      # none of them are what this job is about.
      - name: Boot postgres + pgbouncer + redis + backend
        run: |
          docker compose -f docker-compose.prod.yml up -d --build \
            postgres pgbouncer redis backend

      - name: Wait for the backend (every query it makes goes through pgbouncer)
        run: |
          for i in $(seq 1 30); do
            docker compose -f docker-compose.prod.yml exec -T backend \
              python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" \
              && exit 0
            sleep 2
          done
          echo "backend did not become ready" >&2
          docker compose -f docker-compose.prod.yml logs backend pgbouncer
          exit 1

      # Runs while the app above is up and serving through the pooler --
      # that's the production upgrade path, not a convenience ordering.
      # Succeeding here means alembic reached Postgres over
      # MIGRATIONS_DATABASE_URL: session-level advisory locks and
      # multi-statement DDL do not survive transaction pooling.
      - name: Migrate over the direct DSN while pooled traffic flows
        run: docker compose -f docker-compose.prod.yml exec -T backend python -m app.core.migrations

      - name: pgbouncer is actually pooling, in transaction mode
        run: |
          docker compose -f docker-compose.prod.yml exec -T pgbouncer sh -c \
            'psql -h 127.0.0.1 -p 6432 -U "$DB_USER" -d pgbouncer -tAc "SHOW POOLS"' \
            | tee pools.txt
          grep -q "^forge|" pools.txt || { echo "app never opened a pooled connection" >&2; exit 1; }
          grep -q "|transaction|" pools.txt || { echo "pool_mode is not transaction" >&2; exit 1; }

      - name: /health/ready 200, repeated queries, two sequential transactions
        run: |
          docker compose -f docker-compose.prod.yml exec -T backend python - <<'PY'
          import json, urllib.request, urllib.error, uuid

          BASE = "http://localhost:8000"

          def post(path, payload):
              request = urllib.request.Request(
                  BASE + path, data=json.dumps(payload).encode(),
                  headers={"Content-Type": "application/json"}, method="POST")
              try:
                  with urllib.request.urlopen(request) as response:
                      return response.status
              except urllib.error.HTTPError as exc:
                  return exc.code

          # Repeated identical queries across the whole client pool: with
          # asyncpg's default statement handling this is where transaction
          # pooling raises InvalidSQLStatementNameError /
          # DuplicatePreparedStatementError.
          statuses = set()
          for _ in range(60):
              with urllib.request.urlopen(BASE + "/health/ready") as response:
                  statuses.add(response.status)
          assert statuses == {200}, f"/health/ready returned {statuses}"

          # A request that opens two sequential transactions (user insert +
          # commit, then the follow-up writes), then a second request reusing
          # the pool. 401 on login is the app's own unverified-email path --
          # it still proves the pooled read/write round trip worked.
          email = f"pgbouncer-{uuid.uuid4().hex[:8]}@example.com"
          assert post("/api/v1/auth/register", {"email": email, "password": "Correct-Horse9x"}) == 200
          assert post("/api/v1/auth/login", {"email": email, "password": "Correct-Horse9x"}) in (200, 401)
          print("pooled traffic OK")
          PY

      - name: No prepared-statement errors reached the application
        run: |
          if docker compose -f docker-compose.prod.yml logs backend \
            | grep -iE "InvalidSQLStatementName|DuplicatePreparedStatement|prepared statement"; then
            echo "prepared-statement error through pgbouncer -- see app/core/db.py build_connect_args" >&2
            exit 1
          fi

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v

  security:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # trufflehog/gitleaks scan full git history, not just the latest commit

      # Secret- and dependency-file scanners run first, against the bare
      # checkout, before any install step can drop node_modules/.venv on
      # disk -- those are .gitignored (never scanned in real CI) but would
      # otherwise flood a filesystem-walking scanner with third-party-package
      # false positives and slow the scan down for no benefit.
      - name: Install trufflehog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin v3.95.6

      # --exclude-paths: backend/.env.test is a committed test fixture with a
      # structurally-valid but never-deployed dummy RS256 keypair + Fernet key
      # (Settings() needs real-shaped key material to construct in tests).
      #
      # The three non-backend entries are local-dev Postgres DSNs that
      # trufflehog's Postgres detector reports as *unverified* (it cannot
      # resolve host `postgres`, which only exists inside forge-net):
      # .env.pgbouncer.example's password is literally `change-me`,
      # .env.postgres-exporter.example is postgres/postgres against the
      # compose database, and docker-compose.yml carried the same DSN in an
      # earlier revision -- this scan walks git history, so fixing today's
      # file would not clear it. docker-compose.prod.yml is deliberately NOT
      # excluded: the dev stack is the only one whose credentials are
      # throwaway by construction.
      - name: Trufflehog (git history secret scan)
        run: |
          trufflehog git file://. --fail --no-update \
            --exclude-paths .trufflehog-exclude.txt

      - name: Install gitleaks
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks

      # --no-git: scans the working tree directly rather than git history --
      # .gitleaks.toml allowlists the same known test fixtures as trufflehog
      # above, plus .secrets.baseline (detect-secrets' own file, which stores
      # secret *hashes* that read as high-entropy strings to other scanners).
      - name: Gitleaks (working-tree secret scan)
        run: gitleaks detect --no-git --config .gitleaks.toml

      - name: Get current date for trivy DB cache key
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache trivy vulnerability DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.date.outputs.date }}
          restore-keys: trivy-db-

      - name: Install trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.71.2

      # --skip-files: the same three dummy fixtures trufflehog and gitleaks
      # already allowlist above. Trivy runs its own secret scanner with its own
      # rules, so it needs telling separately -- otherwise the never-deployed
      # RS256 keypair every one of them carries (Settings() needs real-shaped
      # key material to construct) fails this step on three "secrets" that are
      # committed on purpose.
      #
      # --ignore-unfixed (T-350): fail only on findings somebody can act on.
      # This monorepo carries a React Native toolchain, and metro's
      # `image-size` is the shape of the problem -- a HIGH with **no fixed
      # version in the advisory**, so the only responses are suppress it or
      # delete the mobile app. A gate that goes red for something nobody can
      # fix teaches people to ignore the gate, which costs more than the
      # finding. Anything with a fix still fails, which is the whole set this
      # step is useful for.
      #
      # Deliberately scoped to this filesystem scan. The image scan in the
      # `build` job keeps its own settings: an unfixed vulnerability in
      # something we actually ship is a different question from one in a
      # bundler that never leaves a developer's machine.
      #
      # --ignore-policy suppresses one *package at one version* rather than a
      # list of advisory ids -- see .trivyignore.rego for which and why. Four
      # CVEs landed against that pinned node-tar in a single afternoon, so a
      # list of ids reports a clean scan only until the next one is published.
      - name: Trivy filesystem scan (deps + secrets, high+ severity)
        run: |
          trivy fs . --exit-code 1 --severity HIGH,CRITICAL --skip-dirs node_modules             --skip-files backend/.env.e2e             --skip-files backend/.env.loadtest             --skip-files backend/.env.prod-compose             --ignorefile .trivyignore.yaml             --ignore-unfixed             --ignore-policy .trivyignore.rego

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Bandit (medium+ severity)
        working-directory: backend
        run: bandit -r app/ -ll

      - name: Cache semgrep registry rules
        uses: actions/cache@v4
        with:
          path: ~/.cache/semgrep
          key: semgrep-${{ hashFiles('backend/semgrep/**') }}
          restore-keys: semgrep-

      # --config semgrep/ adds the project's own rules (no-os-environ,
      # no-mass-assign, no-plaintext-secret-column) on top of the community
      # registry ruleset.
      - name: Semgrep (community + project custom rules)
        working-directory: backend
        run: semgrep --config auto --config semgrep/ --error app/

      # --skip-editable: forge-saas-backend itself is installed editable and
      # isn't a published package: there's nothing on PyPI/OSV to audit it
      # against, and pip-audit treats an unaudited package as a hard failure
      # otherwise. Real findings in third-party deps still fail this step.
      - name: pip-audit (Python dependency CVEs)
        working-directory: backend
        run: pip-audit --skip-editable

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (Node dependency CVEs, high+ severity)
        run: pnpm audit --audit-level=high

  build:
    needs: [test, security]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # T-313: the document is dumped offline from an *all-modules-on* build
      # of the app (backend/scripts/dump_openapi.py) rather than fetched from a
      # running one. Nothing about producing a schema needs a port, a database
      # or a Redis, and the union of every module is what apps/web's runtime
      # module gating (from /api/v1/config, not at compile time) already
      # assumes -- one bundle serves every configuration, so the client it is
      # built against must contain every configuration's symbols.
      - name: Generate API client from the OpenAPI schema
        run: |
          pip install -e ./backend
          pnpm --filter @forge/api-client generate

      - name: turbo build — gen-client output feeds every package/app build
        run: pnpm build

      # T-350: `zap-baseline` needs this job's marketing output to have a
      # marketing host to scan at all (T-307 generates the Caddy site block
      # as part of the build). Passed as an artifact rather than rebuilt
      # there: that job has no Node toolchain, no pnpm store and no backend
      # install, and adding all three so it can re-derive bytes this job
      # already produced would cost minutes on every push to save a download.
      #
      # `if-no-files-found: ignore` because a product with `marketing` off
      # builds neither path, and that is a valid configuration rather than a
      # broken job -- the scan step below is conditional on the same toggle.
      - name: Upload the marketing site for the ZAP scan
        uses: actions/upload-artifact@v4
        with:
          name: marketing-dist
          path: |
            apps/marketing/dist
            apps/marketing/caddy/dev
          if-no-files-found: ignore
          retention-days: 1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            --label "git-sha=$GITHUB_SHA" \
            -t "$IMAGE:$GITHUB_SHA" \
            -f backend/Dockerfile \
            .

      - name: Get current date for trivy DB cache key
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache trivy vulnerability DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.date.outputs.date }}
          restore-keys: trivy-db-

      - name: Install trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.71.2

      - name: Trivy image scan (high+ severity)
        run: trivy image "$IMAGE:$GITHUB_SHA" --exit-code 1 --severity HIGH,CRITICAL

      # T-225/ASVS V14.2.5: a CycloneDX SBOM of the exact image being
      # shipped -- every Python (pip) and Node (pnpm, via the
      # email-templates-builder stage baked into the runtime image) package,
      # not just top-level deps.
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: "${{ env.IMAGE }}:${{ github.sha }}"
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json
          retention-days: 90

      # Pushed only once the scan above passes -- a vulnerable image never
      # reaches the registry the deploy job pulls from.
      - name: Push image
        run: docker push "$IMAGE:$GITHUB_SHA"

  # T-210: passive DAST pass against a real running instance of the app --
  # boots the same dev stack `make dev` does (minus the worker, which this
  # passive HTTP scan never exercises) and scans it through Caddy, not the
  # bare backend, so TLS termination and security headers are actually in
  # the request path being tested.
  zap-baseline:
    # `build` is the dependency that matters; `lint` is already upstream of it
    # (lint -> test -> build), so naming it as well costs no wall time and
    # makes its marketing-toggle output readable by the step below -- the same
    # output the `lighthouse` job gates on.
    needs: [build, lint]
    runs-on: ubuntu-latest

    # Fixes the compose network name (<project>_forge-net) so the ZAP
    # container below can join it by a known name regardless of what the
    # checkout directory happens to be called on the runner.
    env:
      COMPOSE_PROJECT_NAME: forge-ci

    steps:
      - uses: actions/checkout@v4

      - name: Copy test environment file
        working-directory: backend
        run: cp .env.test .env

      # T-350: the marketing host only exists once `astro build` has written
      # both the site and the Caddy site block that serves it (T-307). The
      # `build` job this one already depends on produced both, so they arrive
      # as an artifact -- compose bind-mounts these two paths (see the caddy
      # service), and without them the stack comes up with no marketing host
      # at all: correct for a product with the module off, useless for a scan
      # meant to find headers on it.
      - name: Fetch the marketing site built upstream
        if: needs.lint.outputs.marketing == 'true'
        uses: actions/download-artifact@v4
        with:
          name: marketing-dist
          path: apps/marketing

      - name: Boot ephemeral stack (backend + Caddy + Postgres + Redis + MinIO + Mailhog)
        run: docker compose up -d postgres redis minio minio-init mailhog backend caddy

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 2
          done
          echo "backend did not become ready" >&2
          docker compose logs backend
          exit 1

      - name: Migrate + seed
        run: |
          docker compose exec -T backend python -m app.core.migrations
          docker compose exec -T backend python -m app.core.seed

      # Confirms the request actually reaches the backend *through* Caddy
      # (TLS termination, security headers, the lot) before handing the URL
      # to ZAP -- catches a broken proxy config before blaming the scanner.
      - name: Wait for readiness through Caddy
        run: |
          for i in $(seq 1 30); do
            curl -sfk https://localhost/health/ready && exit 0
            sleep 2
          done
          echo "caddy/backend did not report ready" >&2
          docker compose logs caddy backend
          exit 1

      # Runs as a container on forge-net rather than against the published
      # host ports, and targets https://caddy (not localhost) -- "caddy" is
      # this container's own service name on that network via compose's
      # embedded DNS; "localhost" from inside the ZAP container would only
      # ever resolve to itself. See the Caddyfile comment for why the site
      # block also matches that hostname.
      - name: ZAP baseline scan (app host)
        run: |
          docker run --rm \
            --network ${{ env.COMPOSE_PROJECT_NAME }}_forge-net \
            -v "$(pwd)/.zap:/zap/wrk:rw" \
            -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t https://caddy -c baseline.conf -r zap-report.html

      # T-350: a second pass, against the second host. Separate rather than a
      # wider spider scope on the first, because the two hosts have
      # deliberately different answers -- marketing sets no cookies and serves
      # a hash-based CSP, the app sets a session cookie and serves an API --
      # and one report mixing them makes "which host is this about?" a
      # question you answer by reading URLs.
      #
      # `marketing.localhost` resolves to the caddy container through the
      # network alias docker-compose.yml gives it: from inside a container
      # that name would otherwise resolve to the container itself, which is
      # why every other check of this host runs on the runner with `curl
      # --resolve` instead. Overrides for it, if it ever needs any, are scoped
      # by URL in the same baseline.conf.
      - name: ZAP baseline scan (marketing host)
        # A product with `marketing` off has no marketing host by design
        # (T-307: the site block is absent, not a host that 404s), so there is
        # nothing here to scan and its absence is verified by the
        # `module-matrix` job instead. Skipped, not failed.
        if: needs.lint.outputs.marketing == 'true'
        run: |
          docker run --rm \
            --network ${{ env.COMPOSE_PROJECT_NAME }}_forge-net \
            -v "$(pwd)/.zap:/zap/wrk:rw" \
            -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t https://marketing.localhost/en/ -c baseline.conf -r zap-marketing-report.html

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: |
            .zap/zap-report.html
            .zap/zap-marketing-report.html
          retention-days: 30

      - name: Tear down stack
        if: always()
        run: docker compose down -v

  # T-220: the Phase 1 acceptance journey (signup -> verify -> invite ->
  # upgrade), driven by a real browser against the same dev stack
  # zap-baseline boots -- see that job's own comments for the shared
  # compose/Caddy conventions. Chromium + WebKit, per playwright.config.ts.
  e2e-web:
    needs: build
    runs-on: ubuntu-latest

    env:
      COMPOSE_PROJECT_NAME: forge-e2e

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # T-313: the document is dumped offline from an *all-modules-on* build
      # of the app (backend/scripts/dump_openapi.py) rather than fetched from a
      # running one. Nothing about producing a schema needs a port, a database
      # or a Redis, and the union of every module is what apps/web's runtime
      # module gating (from /api/v1/config, not at compile time) already
      # assumes -- one bundle serves every configuration, so the client it is
      # built against must contain every configuration's symbols.
      - name: Generate API client from the OpenAPI schema
        run: |
          pip install -e ./backend
          pnpm --filter @forge/api-client generate

      # Produces apps/web/dist, which Caddy bind-mounts (docker-compose.yml's
      # caddy service) once the compose stack boots below. VITE_API_URL=
      # (empty, not unset) makes @forge/api-client's getApiBaseUrl() return
      # "" instead of its http://localhost:8000 dev-server-only fallback --
      # without it, the built SPA calls the backend cross-origin from
      # https://localhost, and the browser silently refuses to persist the
      # __Host-refresh_token cookie (Secure requires the *response* to have
      # come over HTTPS too), breaking session persistence across any full
      # page navigation. A relative base URL keeps every API call same-origin
      # through Caddy, matching how this stack is actually served here.
      - name: turbo build — produces apps/web/dist
        run: pnpm build
        env:
          VITE_API_URL: ""

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium webkit

      # T-220's own "Done when": zero non-data-testid selectors in the E2E
      # suite. Cheap enough as a grep that a dedicated eslint rule isn't
      # worth authoring.
      - name: Enforce data-testid-only selectors in e2e specs
        run: |
          if grep -rnE "getByRole\(|getByText\(|getByLabel\(|getByPlaceholder\(|getByAltText\(|getByTitle\(|\.locator\(\s*[\"'](?!\[data-testid=)" apps/web/e2e; then
            echo "Only data-testid selectors are allowed in apps/web/e2e (T-220)" >&2
            exit 1
          fi

      - name: Copy E2E environment file
        working-directory: backend
        run: cp .env.e2e .env

      # Unlike zap-baseline's passive HTTP scan (which never exercises it),
      # this suite's verification/invitation emails only reach MailHog if
      # something actually dequeues the "send_email" ARQ job -- that's the
      # worker container, not the backend API process.
      - name: Boot ephemeral stack (backend + worker + Caddy + Postgres + Redis + MinIO + Mailhog)
        run: docker compose up -d postgres redis minio minio-init mailhog backend worker caddy

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 2
          done
          echo "backend did not become ready" >&2
          docker compose logs backend
          exit 1

      - name: Migrate + seed
        run: |
          docker compose exec -T backend python -m app.core.migrations
          docker compose exec -T backend python -m app.core.seed

      # Confirms the SPA is actually reachable through Caddy (not just the
      # backend's own /health) before handing off to Playwright.
      - name: Wait for the app through Caddy
        run: |
          for i in $(seq 1 30); do
            curl -sfk https://localhost/health/ready && exit 0
            sleep 2
          done
          echo "caddy/backend did not report ready" >&2
          docker compose logs caddy backend
          exit 1

      # T-307: marketing on its own host, in the same stack the app's own E2E
      # suite is about to run against -- which is what makes "the app host is
      # unaffected" something this job proves rather than assumes. Runs before
      # Playwright so a broken edge is reported as a broken edge rather than
      # as forty failing specs.
      #
      # `curl --resolve` rather than an /etc/hosts entry: no sudo, no DNS
      # assumption about whether this runner resolves *.localhost, and the
      # same command on every machine. The site block being served here is the
      # generated one (apps/marketing/scripts/caddy-site.mjs, written by the
      # `pnpm build` above and bind-mounted into the container).
      - name: Both hosts serve their own site (T-307)
        run: |
          set -euo pipefail
          marketing() { curl -sk --resolve marketing.localhost:443:127.0.0.1 "$@"; }

          echo "--- the app host is still the app"
          curl -sfk https://localhost/ | grep -q '<div id="root">'

          echo "--- the marketing host serves marketing, over its own TLS leaf"
          marketing -f https://marketing.localhost/en/ | grep -q '<html lang="en"'

          headers=$(marketing -D- -o /dev/null https://marketing.localhost/en/ | tr -d '\r')
          echo "$headers"

          echo "--- its own CSP, with hashes rather than 'unsafe-inline'"
          csp=$(echo "$headers" | grep -i '^content-security-policy:')
          echo "$csp" | grep -q "script-src 'self' 'sha256-"
          if echo "$csp" | grep -qi "script-src[^;]*unsafe-inline"; then
            echo "the marketing CSP allows inline script" >&2
            exit 1
          fi

          echo "--- HTML is short-lived; a content-addressed asset is immutable"
          echo "$headers" | grep -qi '^cache-control: public, max-age=300'
          page=$(marketing https://marketing.localhost/en/)
          asset=$(printf '%s' "$page" | grep -o '/_astro/[A-Za-z0-9._-]*\.css' | sort -u | head -1)
          marketing -D- -o /dev/null "https://marketing.localhost$asset" \
            | tr -d '\r' | grep -qi '^cache-control: public, max-age=31536000, immutable'

          echo "--- this build is not the production origin, so: noindex"
          echo "$headers" | grep -qi '^x-robots-tag: noindex'

          echo "--- marketing sets no cookies at all"
          if echo "$headers" | grep -qi '^set-cookie:'; then
            echo "the marketing host set a cookie" >&2
            exit 1
          fi

          echo "--- a locale-less URL is redirected, not 404ed"
          location=$(marketing -o /dev/null -w '%{redirect_url}' \
            -H 'Accept-Language: de-DE,de;q=0.9' https://marketing.localhost/pricing/)
          test "$location" = "https://marketing.localhost/de/pricing/"

      - name: Run Playwright (chromium + webkit)
        working-directory: apps/web
        run: pnpm e2e
        env:
          CI: "true"

      - name: Upload Playwright report + traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 30

      - name: Tear down stack
        if: always()
        run: docker compose down -v

  # Dormant until RENDER_API_KEY / RENDER_BACKEND_SERVICE_ID /
  # RENDER_WORKER_SERVICE_ID / PROD_ENV_FILE / PROD_DATABASE_URL / PROD_DOMAIN
  # secrets are configured on the repo (see docs/runbooks/deploy-render.md).
  # Until then this job simply fails fast on the first curl, on push to main.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      packages: read

    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write production .env (Settings() needs every required field, not just DATABASE_URL)
        run: printf '%s' "${{ secrets.PROD_ENV_FILE }}" > prod.env

      # T-225/ASVS V12.4.2: app.core.config.Settings itself already refuses
      # to boot with VIRUS_SCANNER=noop outside dev, but that failure would
      # only surface as a crash-looping Render service *after* the deploy
      # below -- catching it here fails fast, before migrations even run,
      # against the exact env file the deploy is about to ship.
      - name: Guard against VIRUS_SCANNER=noop in production
        run: |
          if grep -qE '^VIRUS_SCANNER=noop$' prod.env; then
            echo "PROD_ENV_FILE sets VIRUS_SCANNER=noop -- uploaded files would never be scanned. Refusing to deploy." >&2
            exit 1
          fi

      # Same image that was scanned + pushed in `build` -- never reinstalled
      # from source, so what ran migrations is byte-for-byte what gets deployed.
      # Same multi-head reason as the test job's migrate step above -- and it
      # matters more here: `alembic upgrade head` could never have succeeded
      # against this schema, so the production migration step was broken from
      # the day the first module branch landed. Nothing caught it because this
      # workflow had never run.
      - name: Run migrations against production DB (fail = abort, no deploy)
        run: docker run --rm --env-file prod.env "$IMAGE" python -m app.core.migrations

      - name: Capture currently-live deploy (rollback target if the new one fails)
        id: previous
        run: |
          DEPLOY_ID=$(curl -sf -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_BACKEND_SERVICE_ID }}/deploys?status=live&limit=1" \
            | jq -r '.[0] | (.deploy // .) | .id')
          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"

      - name: Trigger Render deploy — backend
        id: deploy_backend
        run: |
          DEPLOY_ID=$(curl -sf -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_BACKEND_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"imageUrl\": \"$IMAGE\"}" | jq -r '.id')
          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"

      - name: Trigger Render deploy — worker
        run: |
          curl -sf -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_WORKER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"imageUrl\": \"$IMAGE\"}"

      # Render keeps the previous deploy serving traffic until the new one
      # reports "live" -- this makes that health gate visible in CI rather
      # than trusting it silently.
      - name: Wait for backend health gate
        run: |
          for i in $(seq 1 60); do
            STATUS=$(curl -sf -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              "https://api.render.com/v1/services/${{ secrets.RENDER_BACKEND_SERVICE_ID }}/deploys/${{ steps.deploy_backend.outputs.deploy_id }}" \
              | jq -r '.status')
            echo "deploy status: $STATUS"
            [ "$STATUS" = "live" ] && exit 0
            case "$STATUS" in *failed*|canceled) exit 1 ;; esac
            sleep 5
          done
          echo "timed out waiting for deploy to go live" >&2
          exit 1

      - name: Smoke test
        id: smoke_test
        run: curl -sf "https://${{ secrets.PROD_DOMAIN }}/health/ready"

      - name: Roll back to previous deploy
        if: failure() && steps.smoke_test.outcome == 'failure'
        run: |
          curl -sf -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_BACKEND_SERVICE_ID }}/rollback" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"deployId\": \"${{ steps.previous.outputs.deploy_id }}\"}"

      # E2E (Playwright) against staging lands in T-220 (Phase 3) -- no
      # Playwright project exists in this repo yet, so this step is
      # intentionally not wired up until then.
