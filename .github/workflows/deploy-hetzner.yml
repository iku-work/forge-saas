name: Deploy — Hetzner (docker compose over SSH)

# A single VPS running docker-compose.prod.yml. The box pulls prebuilt images
# and runs them; it builds nothing.
#
# That last point is the whole design. When the box built its own images,
# Docker build cache reached 30 GB of a 38 GB disk, Postgres began PANICking
# mid-write and the site went down (2026-09-13). Clearing `apps/web/dist`
# before a rebuild left Caddy holding a deleted directory and every page
# 404'd (2026-09-14). Both are structurally impossible here: no build on the
# host, and the bundle lives inside the Caddy image, so a release is a
# container rather than a directory edited underneath a running server.
#
# Secrets this needs, all in the `production` environment:
#   BWS_ACCESS_TOKEN   Bitwarden Secrets Manager machine-account token. The
#                      account reads the forge-prod project, and every secret
#                      there becomes a line of backend/.env (see "Write
#                      prod.env from Bitwarden" for the few that do not)
#   SSH_HOST           box hostname or IP
#   SSH_USER           the login (must be in the `docker` group)
#   SSH_KEY            private key, PEM
#   SSH_KNOWN_HOSTS    output of `ssh-keyscan <host>` -- pinned rather than
#                      trusted on first use, or the deploy would accept a
#                      man-in-the-middle on its first run
#   PROD_DOMAIN        for the post-deploy smoke test

on:
  workflow_call:
    inputs:
      image-tag:
        description: Tag of the already-built, already-scanned GHCR images.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image-tag:
        description: Commit SHA to deploy (must already be built and pushed).
        required: true
        type: string

concurrency:
  # One at a time: two overlapping deploys race on the same migration, and
  # `up -d` on the same compose project would fight over containers.
  group: deploy-hetzner
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    permissions:
      contents: read
      packages: read

    # C4: every value reaches a script through `env:`, never through `${{ }}`
    # pasted into its source. Templating runs before bash parses anything, so
    # a `'` or `$(` in a secret -- or in the free-text `image-tag` input of a
    # manual run -- became shell. Values that are interpolated into the
    # remote script (the tag, the image refs, the actor) are validated first.
    env:
      TAG: ${{ inputs.image-tag }}
      BACKEND_IMAGE: ghcr.io/${{ github.repository }}:${{ inputs.image-tag }}
      CADDY_IMAGE: ghcr.io/${{ github.repository }}-caddy:${{ inputs.image-tag }}
      ACTOR: ${{ github.actor }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      PROD_DOMAIN: ${{ secrets.PROD_DOMAIN }}
      # --env-file: compose interpolates DOMAIN and the other Caddy hostnames
      # from backend/.env, the file this deploy ships, rather than from a
      # root .env that would only ever be edited by hand on the box.
      COMPOSE: >-
        --env-file backend/.env
        -f docker-compose.prod.yml
        -f docker-compose.tls.yml
        -f docker-compose.registry.yml

    steps:
      - name: Validate the values the remote script interpolates
        run: |
          [[ "$TAG" =~ ^[0-9a-f]{7,40}$ ]] || { echo "image-tag must be a commit SHA, got: $TAG" >&2; exit 1; }
          [[ "$BACKEND_IMAGE" =~ ^[a-z0-9./_:-]+$ ]] || { echo "unexpected image ref: $BACKEND_IMAGE" >&2; exit 1; }
          [[ "$ACTOR" =~ ^[A-Za-z0-9-]+(\[bot\])?$ ]] || { echo "unexpected actor: $ACTOR" >&2; exit 1; }

      - uses: actions/checkout@v5

      # Pinned by version and checksum, like any binary that handles the
      # production secrets.
      - name: Install the Bitwarden Secrets Manager CLI
        env:
          BWS_VERSION: "2.1.0"
          BWS_SHA256: ba8233c3a4aee5d43e3c73bbd04d99e9bc5aba13bbbfd06d89b073abe732b860
        run: |
          curl -fsSLo bws.zip "https://github.com/bitwarden/sdk-sm/releases/download/bws-v$BWS_VERSION/bws-x86_64-unknown-linux-gnu-$BWS_VERSION.zip"
          echo "$BWS_SHA256  bws.zip" | sha256sum -c --quiet -
          install -d "$RUNNER_TEMP/bin"
          unzip -q -o bws.zip bws -d "$RUNNER_TEMP/bin"
          rm bws.zip
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # One line of backend/.env per secret the machine account can read,
      # except those meant for other consumers: backups and the Grafana agent
      # on the box, and the client builds (VITE_, EXPO_PUBLIC_). The backend
      # gets what it reads and nothing more.
      #
      # Values are cleaned of what pasting adds and the value never had: the
      # quotes it wore in a .env file, and the trailing newline -- which,
      # left in, quoted DATABASE_URL and five others onto two lines
      # (2026-10-26). A multi-line value (a PEM) is then quoted, because
      # dotenv ends an unquoted value at the newline.
      #
      # The deploy fails, naming the secret, on anything that would ship
      # broken: no secrets at all (the machine account lost access to the
      # project), a name defined twice (which copy wins is not something to
      # find out from a backend that cannot decrypt its own columns), an
      # unclosed quote or a PEM with no END line (compose then misreads every
      # line after it), and the backup identity, which opens every backup and
      # must never be readable by anything that deploys.
      - name: Write prod.env from Bitwarden
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
          BWS_SERVER_URL: https://vault.bitwarden.eu
        run: |
          # $sq: a single quote, which a single-quoted jq program cannot spell.
          secrets=$(bws secret list --output json | jq --arg sq "'" '[.[] | .value |= (
            sub("^\\s+"; "") | sub("\\s+$"; "")
            | if length > 1 and ((startswith("\"") and endswith("\""))
                                 or (startswith($sq) and endswith($sq)))
              then .[1:-1] else . end)]')
          if [ "$(jq length <<<"$secrets")" -eq 0 ]; then
            echo "The machine account can read no secrets. Give it Can read on forge-prod." >&2
            exit 1
          fi
          dupes=$(jq -r '[.[].key] | group_by(.) | map(select(length > 1)[0]) | join(" ")' <<<"$secrets")
          if [ -n "$dupes" ]; then
            echo "Defined more than once in Bitwarden: $dupes" >&2
            exit 1
          fi
          if jq -e 'any(.[]; .key == "BACKUP_AGE_IDENTITY")' <<<"$secrets" >/dev/null; then
            echo "BACKUP_AGE_IDENTITY is readable by the deploy. Move it out of forge-prod." >&2
            exit 1
          fi
          broken=$(jq -r --arg sq "'" '[.[] | select((.value | startswith("\"") or startswith($sq))
                                       or ((.value | contains("-----BEGIN ")) and (.value | contains("-----END ") | not)))
                           | .key] | join(" ")' <<<"$secrets")
          if [ -n "$broken" ]; then
            echo "Malformed in Bitwarden (an unclosed quote, or a PEM with no END line): $broken" >&2
            exit 1
          fi
          jq -r '.[].value | split("\n")[] | select(length >= 8) | "::add-mask::" + .' <<<"$secrets"
          jq -r '.[]
            | select(.key | test("^(BACKUP|GRAFANA|VITE|EXPO_PUBLIC)_") | not)
            | .key + "=" + (if .value | contains("\n") then "\"" + .value + "\"" else .value end)' <<<"$secrets" > prod.env

      # Guards and the registry login -- nothing that touches production.
      # Migrations run on the box below (C4): the production database is
      # never reachable from GitHub's network.
      - name: Preflight — env and guards
        uses: ./.github/actions/deploy-preflight
        with:
          image: ${{ env.BACKEND_IMAGE }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # The *tag*, not the full ref: backend and caddy live in two GHCR
      # repositories that share one tag, so a rollback needs the tag in order
      # to rebuild both refs. And compose is asked which container is the
      # backend rather than guessing `forge-backend-1`, which depends on
      # whatever directory the project happens to sit in. The registry overlay
      # refuses to parse without image refs, so placeholders stand in: `ps`
      # finds the container by service, not by image.
      - name: Record the currently-deployed tag (rollback target)
        id: previous
        run: |
          PREVIOUS=$(ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" \
            "cd ~/forge && docker inspect --format '{{.Config.Image}}' \
               \"\$(BACKEND_IMAGE=unset CADDY_IMAGE=unset docker compose $COMPOSE ps -q backend)\" 2>/dev/null || true")
          echo "full ref currently running: ${PREVIOUS:-<nothing>}"
          PREVIOUS_TAG=${PREVIOUS##*:}
          # Interpolated into the rollback script, so held to the same rule.
          if [[ -n "$PREVIOUS_TAG" && ! "$PREVIOUS_TAG" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "running image has an unexpected tag ($PREVIOUS_TAG); no automatic rollback" >&2
            PREVIOUS_TAG=
          fi
          echo "tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

      # The env file goes over the wire rather than being edited in place.
      # Hand-editing it on the box is how CADDY_TRUSTED_PROXIES came to be
      # missing for a week; the file is now derived from Bitwarden and
      # nothing else.
      - name: Ship the production env
        run: |
          scp -i ~/.ssh/id_deploy prod.env "$SSH_USER@$SSH_HOST:~/forge/backend/.env.next"

      # C4: on the box, from the image about to serve traffic, before anything
      # user-facing changes. Running containers read their env when they
      # start, so swapping the file here does not touch them; the previous
      # file is kept as .env.prev for the rollback. Guarded on .env.next so a
      # re-run never overwrites .env.prev with the new file.
      #
      # The registry token goes over stdin, first line, ahead of nothing else:
      # never in the script text and never in an argv the box's `ps` can see.
      #
      # `python -m app.core.migrations`, never `alembic upgrade head`: this
      # schema has branched module heads and `head` (singular) cannot run.
      - name: Migrate on the box
        id: migrate
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" \
            "cd ~/forge && head -n1 | docker login ghcr.io -u $ACTOR --password-stdin"
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" bash -euo pipefail <<EOF
            cd ~/forge
            git fetch --quiet origin
            git checkout --quiet $TAG
            if [ -f backend/.env.next ]; then
              # A first deploy has no env to keep.
              if [ -f backend/.env ]; then cp backend/.env backend/.env.prev; fi
              mv backend/.env.next backend/.env
            fi

            export BACKEND_IMAGE='$BACKEND_IMAGE'
            export CADDY_IMAGE='$CADDY_IMAGE'
            trap 'docker logout ghcr.io >/dev/null' EXIT
            docker compose $COMPOSE pull --quiet backend worker scanner-worker caddy
            docker logout ghcr.io >/dev/null
            trap - EXIT

            docker compose $COMPOSE run --rm --no-deps backend python -m app.core.migrations
          EOF

      # Idempotent: the images are already pulled and the env is already in
      # place, so this is one `up -d`, which converges however many times it
      # runs -- including after a half-finished first attempt.
      - name: Pull and switch
        id: switch
        run: |
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" bash -euo pipefail <<EOF
            cd ~/forge
            export BACKEND_IMAGE='$BACKEND_IMAGE'
            export CADDY_IMAGE='$CADDY_IMAGE'
            # --no-deps, deliberately. Without it, compose stops caddy and
            # then waits for its dependency chain -- and the backend refuses
            # to start while caddy is down, because caddy carries the network
            # alias for STORAGE_DOMAIN and the storage guard (correctly)
            # refuses to reach object storage over the public internet. That
            # deadlock took production down on 2026-09-14.
            #
            # And caddy in a call of its own, first. In one call, compose still
            # orders caddy after the backend is healthy, which on a fresh box
            # (no caddy running yet, so no alias) never happens: the first
            # deploy to forge-prod-2 hung there (2026-10-26).
            docker compose $COMPOSE up -d --no-deps caddy
            docker compose $COMPOSE up -d --no-deps backend worker scanner-worker
          EOF

      # Review OCT-05: `up -d` returns before healthchecks pass, and the
      # HTTP smoke test below only proves the backend. A scan worker or
      # worker that starts and then crash-loops (as scanner-worker did on its
      # first production boot) would leave the deploy green. Wait until each
      # service runs this release's image and is healthy; a failure here
      # rolls back like any other.
      - name: Verify every service runs the release and is healthy
        id: verify
        run: |
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" bash -euo pipefail <<EOF
            cd ~/forge
            export BACKEND_IMAGE='$BACKEND_IMAGE'
            export CADDY_IMAGE='$CADDY_IMAGE'
            check() {
              local svc=\$1 want=\$2 id image state
              id=\$(docker compose $COMPOSE ps -q \$svc)
              [ -n "\$id" ] || { echo "\$svc: not running"; return 1; }
              image=\$(docker inspect --format '{{.Config.Image}}' \$id)
              state=\$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \$id)
              [ "\$image" = "\$want" ] || { echo "\$svc: runs \$image"; return 1; }
              case "\$state" in healthy|running) return 0 ;; esac
              echo "\$svc: \$state"; return 1
            }
            for _ in \$(seq 1 30); do
              if check backend '$BACKEND_IMAGE' && check worker '$BACKEND_IMAGE' \\
                 && check scanner-worker '$BACKEND_IMAGE' && check caddy '$CADDY_IMAGE'; then
                echo "every service healthy on the release"; exit 0
              fi
              sleep 5
            done
            exit 1
          EOF

      - name: Smoke test
        id: smoke_test
        run: |
          for _ in $(seq 1 30); do
            if curl -sf "https://$PROD_DOMAIN/health/ready" >/dev/null; then
              echo "healthy"
              exit 0
            fi
            sleep 4
          done
          echo "service did not become healthy" >&2
          exit 1

      # C5: runs whenever the box was touched at all -- a failed migration
      # (env and checkout already swapped), a switch that failed halfway
      # (some containers on the new image, some not), or a failed smoke
      # test. The old `steps.switch.outcome == 'success'` missed the
      # half-finished switch, which is the case that most needs undoing. When
      # nothing reached the containers, the `up -d` below converges to what
      # is already running.
      #
      # Only the images, env and checkout move backwards. The database does
      # not: a migration that has already applied stays applied, which is why
      # they must be written to work against the previous release too.
      - name: Roll back to the previous image
        if: failure() && steps.migrate.outcome != 'skipped' && steps.previous.outputs.tag != ''
        env:
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
          REPO: ghcr.io/${{ github.repository }}
        run: |
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" bash -euo pipefail <<EOF
            cd ~/forge
            if [ -f backend/.env.prev ]; then mv backend/.env.prev backend/.env; fi
            rm -f backend/.env.next
            git checkout --quiet $PREVIOUS_TAG
            export BACKEND_IMAGE='$REPO:$PREVIOUS_TAG'
            export CADDY_IMAGE='$REPO-caddy:$PREVIOUS_TAG'
            # Caddy first, for the reason given in "Pull and switch".
            docker compose $COMPOSE up -d --no-deps caddy
            docker compose $COMPOSE up -d --no-deps backend worker scanner-worker
          EOF
          echo "rolled back to $PREVIOUS_TAG" >&2
