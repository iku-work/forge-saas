name: Deploy — Hetzner (docker compose over SSH)

# A single VPS per environment, running docker-compose.prod.yml. The box pulls
# prebuilt images and runs them; it builds nothing.
#
# That last point is the whole design. When the box built its own images,
# Docker build cache reached 30 GB of a 38 GB disk, Postgres began PANICking
# mid-write and the site went down (2026-09-13). Clearing `apps/web/dist`
# before a rebuild left Caddy holding a deleted directory and every page
# 404'd (2026-09-14). Both are structurally impossible here: no build on the
# host, and the bundle lives inside the Caddy image, so a release is a
# container rather than a directory edited underneath a running server.
#
# Every merge runs this twice, from ci.yml: on `staging`, then, only if staging
# came up healthy, on `production` with the same backend image. The edge image
# is built per environment, because its bundles carry the public URLs.
#
# On the box, CI's key runs scripts/deploy-box.sh and nothing else
# (scripts/lock-deploy-key.sh). Each SSH call below is one of its subcommands.
#
# Secrets, in each GitHub environment (`staging`, `production`):
#   BWS_ACCESS_TOKEN   Bitwarden Secrets Manager machine-account token. The
#                      account reads that environment's project, and every
#                      secret there becomes a line of backend/.env (see "Write
#                      the env from Bitwarden" for the few that do not). The
#                      settings that are not secret are committed instead:
#                      deploy/common.env and deploy/<environment>.env.
#   SSH_HOST           box hostname or IP
#   SSH_USER           the login, `forge`
#   SSH_KEY            private key, PEM, locked on the box
#   SSH_KNOWN_HOSTS    output of `ssh-keyscan <host>` -- pinned rather than
#                      trusted on first use, or the deploy would accept a
#                      man-in-the-middle on its first run
# Variable, repository-wide: VITE_SENTRY_DSN (the edge image's build). The
# bundles' URLs come from DOMAIN and MARKETING_DOMAIN in the committed settings.

on:
  workflow_call:
    inputs:
      image-tag:
        description: Tag of the already-built, already-scanned backend image.
        required: true
        type: string
      environment:
        description: staging or production.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image-tag:
        description: Full commit SHA on main to deploy (its backend image must already be built).
        required: true
        type: string
      environment:
        description: Where to deploy it. Production this way skips staging, so keep it for rollbacks.
        required: true
        type: choice
        options: [staging, production]

jobs:
  # The edge, with the SPA and marketing bundles inside it, built from the
  # commit being deployed with this environment's URLs. Built here rather than
  # in ci.yml's build job because those URLs are per environment.
  #
  # It compiles the frontend again rather than reusing CI's turbo build, so
  # the image is reproducible from the Dockerfile alone. The GitHub Actions
  # layer cache is what keeps that from costing a full rebuild each time.
  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}

    permissions:
      contents: read
      packages: write

    env:
      TAG: ${{ inputs.image-tag }}
      TARGET: ${{ inputs.environment }}
      REPO: ghcr.io/${{ github.repository }}
      SSH_HOST: ${{ secrets.SSH_HOST }}

    steps:
      # Before anything is built. An environment's variables fall back to the
      # repository's, which are production's, and a tag is only built once: on
      # 2026-11-09 a merge built staging's image before staging existed, and
      # every later deploy reused bundles pointing at production.
      - name: Name the edge image
        id: ref
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "The $TARGET environment has no SSH_HOST. Set it up first (docs/runbooks/staging.md, docs/runbooks/new-server.md)." >&2
            exit 1
          fi
          [[ "$TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "image-tag must be a full commit SHA, got: $TAG" >&2; exit 1; }
          case "$TARGET" in
            production) suffix= ;;
            staging) suffix=-staging ;;
            *) echo "environment must be staging or production, got: $TARGET" >&2; exit 1 ;;
          esac
          image="${REPO,,}-caddy:$TAG$suffix"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.image-tag }}

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A tag is built once. A redeploy or a rollback to it gets the image that
      # already ran, not a rebuild that might differ.
      - name: Check whether it is already built
        id: exists
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "$IMAGE is already built"
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi

      # The bundles' URLs come from the domains this environment's backend is
      # configured with, so the two cannot disagree.
      - name: Read the committed settings
        if: steps.exists.outputs.built != 'true'
        run: bash scripts/read-deploy-settings.sh "$TARGET"

      - name: Set up Buildx
        if: steps.exists.outputs.built != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push the edge image
        if: steps.exists.outputs.built != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.caddy
          push: true
          tags: ${{ steps.ref.outputs.image }}
          build-args: |
            PUBLIC_SITE_URL=https://${{ env.MARKETING_DOMAIN }}
            PUBLIC_APP_URL=https://${{ env.DOMAIN }}
            PUBLIC_API_URL=https://${{ env.DOMAIN }}
            VITE_API_URL=https://${{ env.DOMAIN }}
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
          cache-from: type=gha,scope=edge-${{ inputs.environment }}
          cache-to: type=gha,mode=max,scope=edge-${{ inputs.environment }}

  deploy:
    needs: edge
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ inputs.environment }}

    # One at a time per box: two overlapping deploys race on the same migration,
    # and `up -d` on the same compose project would fight over containers. On
    # the job, because that is where a called workflow's concurrency applies.
    concurrency:
      group: deploy-hetzner-${{ inputs.environment }}
      cancel-in-progress: false

    permissions:
      contents: read
      packages: read

    # C4: every value reaches a script through `env:`, never through `${{ }}`
    # pasted into its source. Templating runs before bash parses anything, so
    # a `'` or `$(` in a secret -- or in the free-text `image-tag` input of a
    # manual run -- became shell. The box validates what it is sent again.
    env:
      TAG: ${{ inputs.image-tag }}
      TARGET: ${{ inputs.environment }}
      BACKEND_IMAGE: ghcr.io/${{ github.repository }}:${{ inputs.image-tag }}
      ACTOR: ${{ github.actor }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.SSH_HOST }}

    steps:
      - name: Validate the values the box is sent
        run: |
          [[ "$TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "image-tag must be a full commit SHA, got: $TAG" >&2; exit 1; }
          [[ "$ACTOR" =~ ^[A-Za-z0-9-]+(\[bot\])?$ ]] || { echo "unexpected actor: $ACTOR" >&2; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The settings that are not secret are committed, and checked here before
      # anything else: deploy/common.env and deploy/<environment>.env.
      - name: Read the committed settings
        run: bash scripts/read-deploy-settings.sh "$TARGET"

      # Every product but the template itself, whose own deployment is the only
      # one allowed to look like the template. Against production's site even
      # on staging: PRODUCTION_ORIGIN names production's, whichever deploys.
      - name: Refuse the template's identity
        if: github.repository != 'iku-work/forge-saas'
        run: |
          site=$(sed -n 's/^MARKETING_DOMAIN=//p' deploy/production.env)
          bash scripts/check-product-identity.sh "${site:+https://$site}"

      # Pinned by version and checksum, like any binary that handles the
      # production secrets.
      - name: Install the Bitwarden Secrets Manager CLI
        env:
          BWS_VERSION: "2.1.0"
          BWS_SHA256: ba8233c3a4aee5d43e3c73bbd04d99e9bc5aba13bbbfd06d89b073abe732b860
        run: |
          curl -fsSLo bws.zip "https://github.com/bitwarden/sdk-sm/releases/download/bws-v$BWS_VERSION/bws-x86_64-unknown-linux-gnu-$BWS_VERSION.zip"
          echo "$BWS_SHA256  bws.zip" | sha256sum -c --quiet -
          install -d "$RUNNER_TEMP/bin"
          unzip -q -o bws.zip bws -d "$RUNNER_TEMP/bin"
          rm bws.zip
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # backend/.env is the committed settings, then one line per secret in this
      # environment's Bitwarden project (BITWARDEN_PROJECT_ID, from the committed
      # settings), except those meant for other consumers: backups and the
      # Grafana agent on the box, and the client builds (VITE_, EXPO_PUBLIC_).
      # The backend gets what it reads and nothing more. That rules out
      # MIGRATIONS_DATABASE_URL too, a superuser's password that a running app has
      # no use for: the box builds it from its own .env.postgres to migrate.
      #
      # Bitwarden holds secrets only, the names in deploy/secret-names. Anything
      # else there fails the deploy: a setting kept in two places drifts, and
      # the hand-typed copies were where the mistakes came from.
      #
      # Values are cleaned of what pasting adds and the value never had: the
      # quotes it wore in a .env file, and the trailing newline -- which,
      # left in, quoted DATABASE_URL and five others onto two lines
      # (2026-10-26). A multi-line value (a PEM) is then quoted, because
      # dotenv ends an unquoted value at the newline.
      #
      # The deploy fails, naming the secret, on anything that would ship
      # broken: no secrets at all (the machine account lost access to the
      # project), a name defined twice (which copy wins is not something to
      # find out from a backend that cannot decrypt its own columns), an
      # unclosed quote or a PEM with no END line (compose then misreads every
      # line after it), and the backup identity, which opens every backup and
      # must never be readable by anything that deploys.
      - name: Write the env from Bitwarden
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
          BWS_SERVER_URL: https://vault.bitwarden.eu
        run: |
          # $sq: a single quote, which a single-quoted jq program cannot spell.
          if ! listed=$(bws secret list "$BITWARDEN_PROJECT_ID" --output json); then
            echo "Could not read Bitwarden project $BITWARDEN_PROJECT_ID (deploy/$TARGET.env). Is BWS_ACCESS_TOKEN $TARGET's machine account, with Can read on it?" >&2
            exit 1
          fi
          secrets=$(jq --arg sq "'" '[.[] | .value |= (
            sub("^\\s+"; "") | sub("\\s+$"; "")
            | if length > 1 and ((startswith("\"") and endswith("\""))
                                 or (startswith($sq) and endswith($sq)))
              then .[1:-1] else . end)]' <<<"$listed")
          if [ "$(jq length <<<"$secrets")" -eq 0 ]; then
            echo "The machine account can read no secrets. Give it Can read on this environment's project." >&2
            exit 1
          fi
          dupes=$(jq -r '[.[].key] | group_by(.) | map(select(length > 1)[0]) | join(" ")' <<<"$secrets")
          if [ -n "$dupes" ]; then
            echo "Defined more than once in Bitwarden: $dupes" >&2
            exit 1
          fi
          if jq -e 'any(.[]; .key == "BACKUP_AGE_IDENTITY")' <<<"$secrets" >/dev/null; then
            echo "BACKUP_AGE_IDENTITY is readable by the deploy. Move it out of this project." >&2
            exit 1
          fi
          broken=$(jq -r --arg sq "'" '[.[] | select((.value | startswith("\"") or startswith($sq))
                                       or ((.value | contains("-----BEGIN ")) and (.value | contains("-----END ") | not)))
                           | .key] | join(" ")' <<<"$secrets")
          if [ -n "$broken" ]; then
            echo "Malformed in Bitwarden (an unclosed quote, or a PEM with no END line): $broken" >&2
            exit 1
          fi
          not_secret=$(jq -r '.[].key | select(test("^(BACKUP|GRAFANA|VITE|EXPO_PUBLIC)_") | not)' <<<"$secrets" \
            | grep -Fxv -f <(grep -vE '^[[:space:]]*(#|$)' deploy/secret-names) | xargs || true)
          if [ -n "$not_secret" ]; then
            echo "Not secrets, so not for Bitwarden: $not_secret. Commit them to deploy/common.env or deploy/$TARGET.env and delete them from Bitwarden." >&2
            exit 1
          fi
          jq -r '.[].value | split("\n")[] | select(length >= 8) | "::add-mask::" + .' <<<"$secrets"
          {
            cat settings.env
            jq -r '.[]
              | select(.key | test("^((BACKUP|GRAFANA|VITE|EXPO_PUBLIC)_|MIGRATIONS_DATABASE_URL$)") | not)
              | .key + "=" + (if .value | contains("\n") then "\"" + .value + "\"" else .value end)' <<<"$secrets"
          } > prod.env

      # Guards and the registry login -- nothing that touches the box.
      # Migrations run on the box below (C4): its database is never reachable
      # from GitHub's network.
      - name: Preflight — env and guards
        uses: ./.github/actions/deploy-preflight
        with:
          image: ${{ env.BACKEND_IMAGE }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          printf 'Host box\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  BatchMode yes\n' \
            "$SSH_HOST" "$SSH_USER" > ~/.ssh/config
          chmod 600 ~/.ssh/config

      # The *tag*, not the full ref: backend and caddy live in two GHCR
      # repositories that share one tag, so a rollback needs the tag in order
      # to rebuild both refs. Also the first call through the locked key, so a
      # box whose key is not locked yet stops here, before anything changes.
      - name: Record the currently-deployed tag (rollback target)
        id: previous
        run: |
          if ! PREVIOUS_TAG=$(ssh box current); then
            echo "The box did not run scripts/deploy-box.sh. Is CI's key locked (scripts/lock-deploy-key.sh)?" >&2
            exit 1
          fi
          echo "currently running: ${PREVIOUS_TAG:-<nothing>}"
          if [[ -n "$PREVIOUS_TAG" && ! "$PREVIOUS_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "running image has an unexpected tag ($PREVIOUS_TAG); no automatic rollback" >&2
            PREVIOUS_TAG=
          fi
          echo "tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

      # The env file goes over the wire rather than being edited in place.
      # Hand-editing it on the box is how CADDY_TRUSTED_PROXIES came to be
      # missing for a week; the file is derived from Bitwarden and nothing else.
      - name: Ship the env
        run: ssh box env < prod.env

      # C4: on the box, from the image about to serve traffic, before anything
      # user-facing changes: check out the release, swap in the env (the old
      # one is kept for the rollback), pull, bring the data services up to
      # date, back up, migrate. Running containers read their env when they
      # start, so none of this touches them.
      #
      # The registry token goes over stdin, never in an argv the box's `ps`
      # can see. `python -m app.core.migrations` runs there, never alembic's
      # own `upgrade head` (scripts/deploy-box.sh says why).
      - name: Migrate on the box
        id: migrate
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s\n' "$GHCR_TOKEN" | ssh box migrate "$TAG" "$ACTOR"

      # Idempotent: the images are already pulled and the env is already in
      # place, so this is `up -d`, which converges however many times it runs.
      - name: Pull and switch
        id: switch
        run: ssh box switch "$TAG"

      # A failure here rolls back like any other.
      - name: Verify every service runs the release and is healthy
        id: verify
        run: ssh box verify "$TAG"

      - name: Smoke test
        id: smoke_test
        run: |
          for _ in $(seq 1 30); do
            if curl -sf "https://$DOMAIN/health/ready" >/dev/null; then
              echo "healthy"
              exit 0
            fi
            sleep 4
          done
          echo "service did not become healthy" >&2
          exit 1

      # C5: runs whenever the box was touched at all -- a failed migration
      # (env and checkout already swapped), a switch that failed halfway
      # (some containers on the new image, some not), or a failed smoke
      # test. The old `steps.switch.outcome == 'success'` missed the
      # half-finished switch, which is the case that most needs undoing. When
      # nothing reached the containers, the `up -d` there converges to what
      # is already running. The box says whether the old release came back.
      - name: Roll back to the previous image
        if: failure() && steps.migrate.outcome != 'skipped' && steps.previous.outputs.tag != ''
        env:
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        run: ssh box rollback "$PREVIOUS_TAG"

      # Safe for the rollback above: a deploy's rollback target is what is
      # running when it starts, and images in use are never pruned. Not worth
      # failing a deploy that has already succeeded.
      - name: Prune old images
        continue-on-error: true
        run: ssh box prune

      # Behind Cloudflare, 80 and 443 answer Cloudflare only, or anyone who finds
      # the IP skips its WAF and DDoS protection. This runner is outside
      # Cloudflare's ranges, so it sees what they would. The runbook asked for
      # this and nothing checked: forge-prod-2 stayed open (review H2, 2026-11-02).
      #
      # Last on purpose, so it cannot roll back: the release is fine, the firewall
      # is not. A box not behind Cloudflare has nothing to check. This tests the
      # address in SSH_HOST only, which is IPv4 on a runner without IPv6.
      - name: Check the origin refuses direct connections
        run: |
          if ! curl -sI --max-time 10 "https://$DOMAIN/health/ready" | grep -i '^cf-ray:' >/dev/null; then
            echo "$DOMAIN is not behind Cloudflare, nothing to check"
            exit 0
          fi
          open=0
          for port in 80 443; do
            if timeout 5 bash -c "exec 3<>/dev/tcp/$SSH_HOST/$port" 2>/dev/null; then
              echo "::error::Port $port on the origin answers around Cloudflare. Limit it to Cloudflare's ranges (docs/runbooks/new-server.md, step 1). The release stays live."
              open=1
            fi
          done
          exit "$open"
