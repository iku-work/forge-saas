# Weekly, grouped dependency updates: one PR per ecosystem rather than one per
# package, because every PR runs the full CI (about 70 minutes of runners).
#
# cooldown: a release is only proposed once it is a week old. The May 2026
# @tanstack compromise (AGENTS.md §0.12) published malicious versions that were
# pulled within days; waiting out that window is the cheapest defence.
#
# Majors are ignored: they are deliberate upgrades, done by hand. node 22 -> 25
# was proposed as one, and it left LTS and dropped the corepack the Dockerfiles
# use to install pnpm.
#
# npm is not here on purpose. Dependabot re-resolves the whole 12-project pnpm
# workspace once per package (about 75 s each), so a weekly grouped run hit the
# job's ~55-minute limit before it could open a PR, twice. Security fixes still
# arrive: Dependabot security updates (repo settings) open one PR per advisory,
# and `pnpm audit` in the security job fails CI on anything high or critical.
# Routine bumps are `pnpm update -r` by hand; leave Expo SDK packages to
# `npx expo install --fix`.
#
# Python is not here either. CI and the image install from the hash-pinned
# backend/requirements*.lock, exported from uv.lock, and Dependabot can update
# uv.lock but not the export, so its PRs would change nothing that runs.
# pip-audit in the security job flags Python advisories instead; the fix is
# `uv lock --upgrade-package <name>` followed by the two `uv export` commands in
# the Makefile's lock target.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/, /backend]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        patterns: ["*"]
