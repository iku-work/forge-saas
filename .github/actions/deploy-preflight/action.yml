name: Deploy preflight
description: >-
  Everything that must happen on the runner before a platform is touched:
  log in to the registry, materialise the production env, and refuse an
  unsafe one.

# It no longer migrates (C4, 2026-09-29). It used to run the new image here,
# on the GitHub runner, against the production database -- which meant that
# database had to be reachable from GitHub's network. The deploy now migrates
# over SSH on the box, from the image about to serve traffic, before it switches.

inputs:
  image:
    description: Fully qualified image ref, including tag.
    required: true
  prod-env-file:
    description: >-
      The complete production .env, passed from the calling workflow's
      secrets. Composite actions cannot read `secrets` themselves. Leave it
      out when an earlier step already wrote prod.env (Hetzner reads it from
      Bitwarden).
    required: false
    default: ""
  registry-username:
    description: GHCR username.
    required: true
  registry-password:
    description: GHCR token.
    required: true

outputs:
  env-file:
    description: Path to the materialised env file, for later steps.
    value: ${{ steps.write-env.outputs.path }}

runs:
  using: composite
  steps:
    - name: Log in to GHCR
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Write production .env
      id: write-env
      shell: bash
      # Settings() validates every required field at import, not just
      # DATABASE_URL, so the whole file has to be present before the
      # migration below can even start.
      # C4: through `env:`, never `${{ }}` in the script. Templating pastes the
      # value into the source before bash parses it, so a `'` or `$(` in the
      # env file -- a password, say -- became shell running with the deploy's
      # credentials. From a variable it is data, byte for byte.
      env:
        PROD_ENV_FILE: ${{ inputs.prod-env-file }}
      run: |
        if [ -n "$PROD_ENV_FILE" ]; then
          printf '%s' "$PROD_ENV_FILE" > prod.env
        fi
        echo "path=prod.env" >> "$GITHUB_OUTPUT"
        if [ ! -s prod.env ]; then
          echo "The production env is empty -- refusing to deploy." >&2
          exit 1
        fi

    # T-225/ASVS V12.4.2: app.core.config.Settings already refuses to boot
    # with VIRUS_SCANNER=noop outside dev, but that failure would only
    # surface as a crash-looping service *after* the deploy. Catching it here
    # fails fast, before any platform is touched, against the exact env file the
    # deploy is about to ship.
    - name: Guard against VIRUS_SCANNER=noop in production
      shell: bash
      run: |
        if grep -qE '^VIRUS_SCANNER=noop$' prod.env; then
          echo "PROD_ENV_FILE sets VIRUS_SCANNER=noop -- uploaded files would never be scanned. Refusing to deploy." >&2
          exit 1
        fi
