title = "ForgeSaaS gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Known dummy fixtures committed on purpose, not real secrets"
paths = [
  # detect-secrets' own baseline: stores SHA-1 *hashes* of allowlisted
  # findings, not secrets. High-entropy hex digests trip the generic-api-key
  # rule every time.
  '''\.secrets\.baseline''',
  # Settings() needs a structurally-valid RS256 keypair + Fernet key to
  # construct in tests; both are dummy, never-deployed, generated solely for
  # tests/test_config.py (see file header comment).
  '''backend/\.env\.test''',
  # Placeholder PEM markers ("...") for documentation only -- not parseable
  # key material, but gitleaks' private-key rule matches the BEGIN/END
  # markers regardless of body content.
  '''backend/\.env\.example''',
  # T-244: same dummy keypair as .env.test above, in the fixture CI's
  # pgbouncer-prod-compose job boots docker-compose.prod.yml with.
  '''backend/\.env\.prod-compose''',
  # T-220: same dummy keypair again, in the fixture the e2e-web job (and
  # maestro-mobile.yml) copies to .env to boot the stack for Playwright.
  '''backend/\.env\.e2e''',
  # T-223: and again, for the k6 load-test stack.
  '''backend/\.env\.loadtest''',
  # Local-dev Postgres DSNs against the compose database, which only exists
  # inside forge-net. Kept in step with .trufflehog-exclude.txt (see the
  # comment on CI's trufflehog step for why history makes the compose file
  # one of them). docker-compose.prod.yml stays scanned.
  '''\.env\.pgbouncer\.example''',
  '''\.env\.postgres-exporter\.example''',
  '''docker-compose\.yml''',
]
