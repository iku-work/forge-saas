# Trivy suppressions (T-350).
#
# Same rule as .zap/baseline.conf: every entry carries an owner, a date, and a
# reason somebody can check. An undocumented ignore is not allowed, and neither
# is an ignore added instead of reading the finding.
#
# `expired_at` is the point of using the YAML format rather than a bare
# .trivyignore list: a suppression with no end date is a decision nobody
# revisits. When one expires the scan goes red again and somebody has to look.
#
# Nothing *unfixed* belongs here. CI passes `--ignore-unfixed`, so a finding
# with no fixed version -- metro's `image-size` is the standing example --
# never reaches this file. Every entry below is therefore a vulnerability that
# **has** a fix which this repo has a stated reason not to take.
#
# node-tar 6.2.1 is not here: .trivyignore.rego covers it, with its own expiry.

vulnerabilities:
  # 2026-10-01 iku-work — expires 2027-01-01
  #
  # image-size 1.2.1, reachable only through metro@0.81.5 (the React Native
  # bundler). The fix is 2.0.3, a major that replaced the callable default
  # export with a named `imageSize`; metro's src/Assets.js does
  # `const getImageSize = require("image-size")` and calls it, so overriding
  # to 2.x breaks every asset bundle. What is exposed: metro sizing image
  # assets from this repo, on a developer machine or a mobile build. Not
  # shipped, not reachable from the deployed product. The fix is the Expo SDK
  # upgrade that moves metro past 0.81 -- the same upgrade the tar entries
  # above are waiting on.
  - id: CVE-2025-71329
    paths:
      - "pnpm-lock.yaml"
    statement: >-
      image-size 1.2.1 via metro (dev bundler); 2.x breaks metro's
      require-and-call usage. Build-time only, not in the product.
    expired_at: 2027-01-01
  - id: CVE-2025-71330
    paths:
      - "pnpm-lock.yaml"
    statement: Same image-size 1.2.1 via metro as CVE-2025-71329.
    expired_at: 2027-01-01

  # 2026-10-24 iku-work — expires 2027-01-24
  #
  # zod 3.25.76: memory exhaustion validating a huge array that has no length
  # cap. The fix exists only in 4.6.6; zod 3 gets none, and web, mobile, ui
  # and validation all depend on ^3, so taking it means migrating to zod 4.
  # Every zod in this repo runs in the browser or at build time (forms, Astro
  # content schemas), never on a server parsing attacker input, so the worst
  # case is a user exhausting their own tab. The zod 4 copies are overridden
  # to 4.6.6+ in pnpm-workspace.yaml, where pnpm audit's GHSA-mrhx-c7xc-m3w5
  # is ignored for the same reason. The expiry forces the zod 4 migration.
  - id: CVE-2023-54404
    paths:
      - "pnpm-lock.yaml"
    statement: >-
      zod 3.x has no fix (4.6.6+ only); client-side and build-time
      validation only, never server-side. zod 4 copies are overridden.
    expired_at: 2027-01-24

  # 2026-10-30 iku-work — expires 2027-01-30
  #
  # decode-uri-component 0.2.2: quadratic time decoding many distinct
  # percent-encoded runs. FIXED, not accepted: patches/decode-uri-component@
  # 0.2.2.patch backports 0.5.1's decoder, and trivy still matches the version
  # number. The patch is needed because 0.5.1 is ESM-only and the one consumer,
  # query-string 7 under expo-router, require()s it.
  # apps/mobile/src/test/decodeUriComponentPatch.test.ts runs the advisory's
  # proof of concept through the app's own dependency chain and fails if an
  # unpatched copy comes back; pnpm refuses to install if the patch stops
  # applying.
  # Permanent fix, deferred to mobile work (2026-10-31): @react-navigation/core
  # 7.23+ no longer uses query-string, so bumping @react-navigation/native to
  # 7.5.1+ (in range for expo-router 4, no SDK upgrade) removes the package.
  # It changes deep-link URL parsing, so it needs a Maestro run. Then drop
  # this entry, the patch, its test and the two pnpm auditConfig ignores.
  - id: CVE-2026-118664
    paths:
      - "pnpm-lock.yaml"
    statement: >-
      Fixed by patches/decode-uri-component@0.2.2.patch (backport of 0.5.1);
      verified by apps/mobile/src/test/decodeUriComponentPatch.test.ts.
    expired_at: 2027-01-30
