<!DOCTYPE html>
<!--
  What a page that passes check-seo.mjs looks like, reduced to the three tags
  it checks. Kept beside the broken ones so the test can prove the checker
  distinguishes them rather than failing everything it is pointed at.
-->
<html lang="en">
  <head>
    <title>A page with everything it needs</title>
    <meta name="description" content="One title, one description, one canonical." />
    <link rel="canonical" href="https://forge.example/clean/" />
  </head>
  <body>
    <p>Body.</p>
  </body>
</html>
