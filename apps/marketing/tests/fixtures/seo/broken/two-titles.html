<!DOCTYPE html>
<!-- A layout that emits a title and a page that emits its own: the failure the slot-and-layout arrangement in BaseLayout exists to make impossible. -->
<html lang="en">
  <head>
    <title>The title the layout wrote</title>
    <title>The title the page wrote</title>
    <meta name="description" content="Which of the two a crawler takes is not up to the author." />
    <link rel="canonical" href="https://forge.example/two-titles/" />
  </head>
  <body>
    <p>Body.</p>
  </body>
</html>
