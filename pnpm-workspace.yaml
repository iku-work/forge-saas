packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  # Native binary downloader for the sentry-cli binary that @sentry/vite-plugin
  # (T-201) shells out to when uploading source maps -- CI-only (see
  # apps/web/vite.config.ts), but the postinstall still needs to fetch the
  # platform binary at install time regardless.
  '@sentry/cli': true
  # Native binary downloader for tsup's (and, via @storybook/test-runner's
  # jest dependency chain, jest's) swc transform -- already trusted
  # transitively before T-150 added storybook tooling, now needs its own
  # postinstall to fetch the platform binary.
  '@swc/core': true
  esbuild: true
  # msw's postinstall copies the browser service-worker script into the
  # directory named by a package's `msw.workerDirectory` key. Most packages
  # in this workspace only use msw/node (setupServer) and declare no such
  # key, so the script is a no-op there. packages/ui (T-150) declares
  # `"msw": { "workerDirectory": ["public"] }` for Storybook's
  # msw-storybook-addon, which does need the generated
  # public/mockServiceWorker.js -- see packages/ui/.storybook/preview.tsx.
  msw: true
  # Native resolver binding used by jest-resolve, itself pulled in by
  # @storybook/test-runner (T-150) -- same "download a platform binary"
  # shape as @swc/core/esbuild above.
  unrs-resolver: true
minimumReleaseAgeExclude:
  - "@tanstack/query-core@5.101.1"
  - "@tanstack/react-query@5.101.1"
  - '@sentry/expo-upload-sourcemaps@8.17.2'
  - '@sentry/react-native@8.17.2'
overrides:
  # Three copies of @types/node were in this tree (22, 24, 26) with nothing
  # choosing between them, so which one the Astro language server resolved
  # depended on the shape of the install -- green locally, red on a fresh
  # `--frozen-lockfile` checkout in CI, on a file nobody had touched.
  #
  # 26.0.0 is why it mattered rather than merely being untidy: it changed
  # `ChildProcess` from `extends EventEmitter` to `implements EventEmitter`
  # *without declaring any of the members*, so `child.on(...)` stops existing
  # on the type. apps/marketing/tests/content.test.ts uses it to watch a dev
  # server start.
  #
  # Pinned to the version apps/web already declares and CI's runner already
  # runs (node-version: "22"), for the same reason backend/pyproject.toml
  # pins ruff, mypy, pytest and schemathesis: a dependency nobody chose must
  # not be able to turn a green tree red on its own. A devDependency in
  # apps/marketing does not fix this -- the language server does not resolve
  # through that package's node_modules, which is exactly what made the
  # original resolution a lottery.
  "@types/node": "22.20.0"
  "@tanstack/react-router": ">=1.170.4"
  "@tanstack/react-router-devtools": ">=1.167.0"
  "@tanstack/router-plugin": ">=1.168.18"
  # T-054 security job (trivy fs / pnpm audit): transitive pins dragged in by
  # Expo CLI tooling resolved to vulnerable versions — force the fixed ones.
  #
  # Pinned to the 0.8.x line, not >=0.9.10 (T-222): every current consumer
  # here is Expo/RN native-build tooling (@expo/plist, and plist/simple-plist
  # used by the Xcode project tooling), all of which call
  # `DOMParser.parseFromString(xml)` with no mimeType arg -- optional through
  # 0.8.x, but mandatory as of 0.9.0 (throws "the provided mimeType
  # 'undefined' is not valid" otherwise), which broke `expo prebuild`
  # outright. 0.8.13 carries the same CVE fixes trivy/pnpm audit wanted
  # (advisories list "0.8.13, 0.9.10 or above" as the fixed versions), so it
  # satisfies the security job without the 0.9.0 breaking change. Tilde-pinned
  # so a future `pnpm install` can't silently float across that line again.
  "@xmldom/xmldom": "~0.8.13"
  # Bumped from >=7.5.11 (T-350): the floor only covers the CVEs known when it
  # was written, and 7.5.16 resolved under it carries CVE-2026-59873
  # (CRITICAL, gzip bomb), -59874 and -73566. 7.5.21 is the highest fix line
  # among them. A floor is a decision with an expiry date -- trivy is what
  # notices when it has passed.
  "tar": ">=7.5.21"
  # CVE-2026-13149 (HIGH), which reaches this tree only through the 1.x line.
  # Scoped to that line on purpose: an unscoped `>=1.1.16` is satisfied by
  # 5.0.6, so pnpm hoists *every* consumer onto it -- including `minimatch@3`,
  # which asks for `^1.1.7`. Forcing a transitive dependency across two major
  # versions to fix a DoS in one of them trades a known bug for an unknown
  # one, in glob matching, in the build tooling.
  "brace-expansion@1": ">=1.1.18 <2"
  # The 1.x pin above fixed the copy `minimatch@3` asks for; newer consumers
  # pull their own 5.x, which carries the same advisory and needed its own
  # floor. A scoped override fixes one line, not the package.
  "brace-expansion@5": ">=5.0.9 <6"
  # T-350: the rest of what trivy's HIGH set found once the job could finally
  # reach this step. All seven are transitive build tooling -- none is a
  # dependency of apps/web or any packages/* -- and every one is pinned to a
  # fix on its *own* major, so nothing here moves a consumer across a version
  # it was written against. The alternative, letting each float to "latest
  # fixed", is what turned the brace-expansion pin into a minimatch problem.
  # Upper bounds are not decoration. A key like `js-yaml@3` selects which
  # *requests* to rewrite, and the value is then free to satisfy them with
  # anything -- so a bare `>=3.15.0` resolved every `^3` consumer onto 4.x,
  # which is where `safeLoad` was removed. Each of these stays inside the
  # major it was asked for.
  "fast-uri@3": ">=3.1.3 <4"
  "js-yaml@3": ">=3.15.0 <4"
  "nanoid@3": ">=3.3.18 <4"
  "postcss@8": ">=8.5.18 <9"
  "shell-quote@1": ">=1.9.0 <2"
  "socket.io-parser@4": ">=4.2.7 <5"
  # Exempted from the blanket tar bump above (T-222): @expo/cli@0.22.28's own
  # bundled tar.js/npm.js do `require('tar').default.extract` -- CJS interop
  # that assumes any `__esModule`-flagged module also has a `.default`. tar's
  # 7.x line sets `__esModule: true` but doesn't provide a `.default`, so
  # forcing @expo/cli onto 7.x breaks `expo prebuild`/`expo run:ios` outright
  # ("Cannot read properties of undefined (reading 'extract')"). @expo/cli
  # already declares "tar": "^6.2.1", which is itself past the CVE-2024-28863
  # fix the blanket override exists for, so pinning just this edge back to
  # 6.x keeps the security fix everywhere else without breaking native builds.
  "@expo/cli>tar": "^6.2.1"
patchedDependencies:
  expo-localization@16.0.1: patches/expo-localization@16.0.1.patch
