networks:
  forge-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:

services:
  postgres:
    image: postgres:16-alpine
    # T-205: pg_stat_statements must be preloaded at postmaster start --
    # CREATE EXTENSION alone (the migration) only registers the catalog
    # objects; without this flag, querying the view raises "pg_stat_statements
    # must be loaded via shared_preload_libraries".
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: forge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - forge-net

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - forge-net

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # app.modules.storage.backends.s3.S3Backend always requests SSE-S3
      # (x-amz-server-side-encryption: AES256) on presigned uploads -- real
      # AWS S3 honors that with no KMS setup, but MinIO refuses *any*
      # server-side encryption, even SSE-S3, unless a KMS key is configured;
      # without this, every presigned upload 501s with "KMS not configured".
      # This is MinIO's own single-key SSE (no external KMS server needed),
      # dev-only value -- fine to be static/committed.
      MINIO_KMS_SECRET_KEY: "forge-local-dev:tHWvc0PGShe5j8xl3q3vpa2JO5qEDjgSUSQ6/PVu9oM="
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - forge-net

  # One-shot: creates the AWS_BUCKET_NAME bucket (T-037's export job uploads
  # here) -- the minio image ships its own `mc` client, so no separate image is
  # needed. Idempotent (--ignore-existing), exits after running once.
  #
  # Creates both bucket names that appear across the repo's env files
  # (.env.example uses forge-local; .env.test/.env.e2e/.env.loadtest use
  # forge-test) rather than just one -- whichever env file gets copied to
  # backend/.env before this stack boots, AWS_BUCKET_NAME resolves to a
  # bucket that actually exists. Before this, any env file using the
  # "wrong" name would presign uploads against a bucket MinIO never
  # created, and every confirm would 422 with file_not_uploaded -- nothing
  # exercised a real upload through this compose stack (vs. testcontainers'
  # own dedicated bucket in test_storage_backend.py) until T-223's presign.js.
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    entrypoint: ["/bin/sh", "-c"]
    # Review R1: uploads land under incoming/ and confirm copies them out, so
    # anything still there after a day is either an upload nobody confirmed
    # or a form re-posted after its confirm. Neither is read by anything.
    # The purge jobs delete both copies of a file; this rule is the backstop
    # for the second case, which has no row of its own. `ilm import`
    # replaces the whole configuration, so a restart is a no-op rather than
    # a duplicate rule (`ilm rule add` appends one every time).
    command:
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/forge-local &&
        mc mb --ignore-existing local/forge-test &&
        for bucket in forge-local forge-test; do
          echo '{"Rules":[{"ID":"expire-incoming","Status":"Enabled","Filter":{"Prefix":"incoming/"},"Expiration":{"Days":1}},{"ID":"expire-data-exports","Status":"Enabled","Filter":{"Prefix":"data-exports/"},"Expiration":{"Days":1}}]}' | mc ilm import "local/$$bucket" || exit 1
        done
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - forge-net

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - forge-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    image: forge-saas-backend-dev
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/forge
      REDIS_URL: redis://redis:6379/0
      AWS_ENDPOINT_URL: http://minio:9000
      SMTP_HOST: mailhog
    volumes:
      - ./backend:/app
      # packages/i18n/locales/ lives outside the ./backend build context --
      # app/core/i18n.py falls back to reading it from here (see that
      # module's _BAKED_LOCALES_DIR) when the sibling packages/ directory
      # isn't present in the container (T-068).
      - ./packages/i18n/locales:/app/locales:ro
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --reload --host 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - forge-net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    image: forge-saas-backend-dev
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/forge
      REDIS_URL: redis://redis:6379/0
      AWS_ENDPOINT_URL: http://minio:9000
      SMTP_HOST: mailhog
    volumes:
      - ./backend:/app
      - ./packages/i18n/locales:/app/locales:ro
      # send_email (T-106) shells out to this compiled, dependency-free CLI --
      # see app/workers/jobs/email.py's _BAKED_EMAIL_RENDERER_CLI. Built by
      # `make dev` (pnpm --filter @forge/email-templates build) before this
      # container starts, same reasoning as the locales mount above.
      - ./packages/email-templates/dist:/app/email-templates:ro
    command: arq app.workers.main.WorkerSettings
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - forge-net

  # Review R4: virus scans run on their own queue in their own process, so a
  # burst of uploads cannot occupy the slots email and deletion need. Same
  # image and env as `worker`; only the entrypoint class differs.
  scanner-worker:
    image: forge-saas-backend-dev
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/forge
      REDIS_URL: redis://redis:6379/0
      AWS_ENDPOINT_URL: http://minio:9000
    volumes:
      - ./backend:/app
      - ./packages/i18n/locales:/app/locales:ro
    command: arq app.workers.main.ScanWorkerSettings
    depends_on:
      worker:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    networks:
      - forge-net

  caddy:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      # T-220: apps/web/dist is built on the host (`pnpm build`) before this
      # container starts, same mount-a-host-built-artifact pattern already
      # used for packages/i18n/locales and packages/email-templates/dist
      # above -- Caddy serves the SPA's static files directly rather than
      # adding a whole extra Node/nginx container just to do that. Fine to
      # be empty/missing for stacks that never build the frontend (e.g. the
      # ZAP baseline job): file_server just 404s on those paths, everything
      # else (/api, /health, /docs) still reaches the backend unaffected.
      - ./apps/web/dist:/srv/web:ro
      # T-307: the marketing site, on its own host (marketing.localhost). Same
      # host-built-artifact pattern as /srv/web above and, like it, fine to be
      # empty or missing -- the site block that serves this directory is
      # generated by apps/marketing's build into the conf.d mount below, so a
      # stack that never built the frontend simply has no marketing host and
      # an app host that behaves exactly as it always did.
      - ./apps/marketing/dist:/srv/marketing:ro
      # The generated site block itself. Written by
      # apps/marketing/scripts/caddy-site.mjs on every `astro build`, removed
      # by scripts/guard-enabled.mjs when `modules.marketing` is false, and
      # imported by the Caddyfile as a glob -- so "no marketing module" and
      # "frontend never built" are the same, safe, config.
      - ./apps/marketing/caddy/dev:/etc/caddy/conf.d:ro
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      forge-net:
        # T-350: the marketing host, resolvable *inside* the compose network.
        # From a container, `marketing.localhost` would otherwise resolve to
        # that container itself -- which is why every existing check of this
        # host (ci.yml's edge assertions) runs on the runner with `curl
        # --resolve` rather than in here. The ZAP baseline scan cannot: it is
        # a container on this network, and it addresses services by their
        # compose DNS name. An alias makes the marketing host reachable the
        # same way `caddy` already is, so it can be scanned rather than
        # skipped. Costs a default stack nothing -- an unused alias is a DNS
        # record nobody looks up.
        aliases:
          - marketing.localhost

  # T-204: local Grafana/Prometheus stack for viewing docs/grafana/*.json
  # against live data -- `make observe`. Never started by default (`make dev`
  # doesn't touch this profile); scrapes the same backend:8000/metrics T-202
  # locks out of the public edge, but this stack itself stays inside
  # forge-net too (Grafana's port is the only one published).
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    volumes:
      - ./docs/grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # T-205: rule_files: [alerts.yml] in prometheus.yml resolves relative
      # to that file's own directory, so this must land alongside it.
      - ./docs/grafana/alerts.yml:/etc/prometheus/alerts.yml:ro
    networks:
      - forge-net

  # T-205: exports pg_stat_statements as Prometheus metrics for
  # database.json's "hall of shame" panel and alerts.yml's slow-query alert.
  # Same observability profile as prometheus/grafana above -- never started
  # by `make dev`.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    profiles: ["observability"]
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@postgres:5432/forge?sslmode=disable"
    command:
      - "--extend.query-path=/etc/postgres_exporter/queries.yaml"
    volumes:
      - ./docs/grafana/postgres-exporter-queries.yaml:/etc/postgres_exporter/queries.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - forge-net

  # T-223: `make load-test` and the nightly load-test CI job run k6 through
  # this rather than a host-installed k6 binary. profiles: ["loadtest"] keeps
  # it out of `docker compose up -d` (make dev), same as observability's
  # prometheus/grafana below -- `docker compose run --rm k6 ...` still works
  # despite the profile (run/exec ignore profile restrictions for a service
  # named explicitly on the command line), and joining forge-net lets
  # BASE_URL address the backend by its compose service name instead of a
  # published host port, avoiding any dependency on this project's exact
  # compose network name.
  k6:
    image: grafana/k6:latest
    profiles: ["loadtest"]
    environment:
      BASE_URL: http://backend:8000
    volumes:
      - ./tests/load:/scripts:ro
      - ./tests/load/results:/results
    networks:
      - forge-net

  grafana:
    image: grafana/grafana:11.3.1
    profiles: ["observability"]
    environment:
      # Anonymous admin access is a dev-only convenience (same class of
      # decision as minio's static MINIO_KMS_SECRET_KEY above) -- this stack
      # is never reachable outside forge-net/the published Grafana port.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./docs/grafana/provisioning:/etc/grafana/provisioning:ro
      # Mounted at a path outside (not nested under) the read-only
      # provisioning mount above, and referenced by its absolute path from
      # dashboards.yml's `options.path` -- nesting a second bind mount
      # inside an already-:ro-mounted parent directory fails to create its
      # own mountpoint under Docker Desktop's Linux VM (confirmed
      # empirically), since that subdirectory doesn't exist on the host
      # side of the parent mount.
      - ./docs/grafana/dashboards:/etc/grafana/dashboards-json:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - forge-net
