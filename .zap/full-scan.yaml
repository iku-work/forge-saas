# ZAP Automation Framework plan (T-211) -- the aggressive, authenticated
# counterpart to T-210's passive baseline.conf. Run nightly by
# .github/workflows/zap-full.yml against a real staging deployment, never
# against the throwaway compose stack T-210 uses -- active scanning sends
# real attack payloads, which is only safe somewhere nothing else depends on.
#
# ${STAGING_URL} / ${ZAP_SCANNER_EMAIL} / ${ZAP_SCANNER_PASSWORD} come from
# the workflow's process environment (docker_env_vars in zap-full.yml) --
# the Automation Framework substitutes any ${VAR} it doesn't define itself
# from the OS environment, per
# https://www.zaproxy.org/docs/desktop/addons/automation-framework/environment/
#
# Every relative path in this plan resolves from this file's directory, not
# the repo root.
#
# The target's rate limits have to be raised for the run (see zap-full.yml), or
# this measures the limiter.

env:
  contexts:
    - name: "staging"
      urls:
        - "${STAGING_URL}"
      includePaths:
        - "${STAGING_URL}/api/v1/.*"
      excludePaths:
        # Real Stripe API calls -- Checkout Session objects, webhooks -- live
        # behind these routes. An active scan fuzzing them repeatedly would
        # spam Stripe's API and litter the Stripe dashboard with junk test
        # objects, not find a bug in our code (Stripe Checkout is hosted;
        # nothing here renders attacker-controlled HTML).
        - "${STAGING_URL}/api/v1/billing/.*"
        # T-202: internal-only; Caddy 404s this from outside already, so
        # there's nothing here for the scanner to usefully attack.
        - "${STAGING_URL}/metrics"
        # The scanner owns its own org (see users below). The spec below hands
        # ZAP every route, so these would end its session, delete it or take it
        # out of the org, and lock it out of the rest of the run.
        - "${STAGING_URL}/api/v1/me$"
        - "${STAGING_URL}/api/v1/orgs/.*/leave"
        - "${STAGING_URL}/api/v1/auth/logout.*"
        - "${STAGING_URL}/api/v1/auth/sessions/.*"
        - "${STAGING_URL}/api/v1/auth/change-password"
        - "${STAGING_URL}/api/v1/auth/2fa/enable"
        # Fuzzing it would spend the 5/minute sign-in budget the scanner's own
        # re-logins need, and most of its answers would be the limiter's.
        - "${STAGING_URL}/api/v1/auth/login$"
        # These email whatever address the request names, and staging sends real
        # mail: made-up addresses bounce against the domain production uses. For
        # a local run, where mail goes to MailHog, delete these two lines.
        - "${STAGING_URL}/api/v1/orgs/.*/invitations.*"
        - "${STAGING_URL}/api/v1/auth/change-email.*"
      authentication:
        method: "json"
        parameters:
          loginRequestUrl: "${STAGING_URL}/api/v1/auth/login"
          loginRequestBody: '{"email":"{%username%}","password":"{%password%}"}'
        verification:
          method: "response"
          # Envelope on success: {"data":{"access_token":"...",...},"error":null,...}
          # Envelope on failure: {"data":null,"error":{"code":"...",...},...}
          # Starlette's JSONResponse serialises with no whitespace after ':'
          # or ',' (separators=(",", ":")), so these match literally.
          # Only a rejected token counts as logged out. Every 404 and 422 has an
          # error envelope too, and each one would otherwise trigger a new login.
          loggedInRegex: '\Q"access_token"\E'
          loggedOutRegex: '\Q"error":{"code":"authentication_failed"\E'
      sessionManagement:
        method: "script"
        parameters:
          script: "scripts/bearer-session.js"
          scriptEngine: "ECMAScript : Graal.js"
      users:
        - name: "zap-scanner"
          credentials:
            username: "${ZAP_SCANNER_EMAIL}"
            password: "${ZAP_SCANNER_PASSWORD}"
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true

jobs:
  - type: passiveScan-config
    parameters:
      maxAlertsPerRule: 10

  # Proves authentication actually works *before* the expensive spider/active
  # scan jobs run -- fails fast (failOnError) with a clear job name instead of
  # burning an hour to discover every request was made as an anonymous user.
  - type: requestor
    parameters:
      user: "zap-scanner"
    requests:
      - url: "${STAGING_URL}/api/v1/auth/me"
        name: "authenticated smoke check"
        method: "GET"
        responseCode: 200

  # A spider finds no links in a JSON API, and production does not serve its
  # spec, so the routes come from the copy the API client is generated from.
  - type: openapi
    parameters:
      apiFile: "../packages/api-client/openapi.json"
      targetUrl: "${STAGING_URL}"
      context: "staging"
      user: "zap-scanner"

  - type: passiveScan-wait
    parameters:
      maxDuration: 5

  - type: activeScan
    parameters:
      context: "staging"
      user: "zap-scanner"
      # Inside zap-full.yml's job timeout, or the job dies before the reports.
      maxScanDurationInMins: 30
    policyDefinition:
      defaultStrength: "medium"
      defaultThreshold: "medium"
      rules:
        # Time-based blind SQL injection (sleep()/pg_sleep()/WAITFOR DELAY)
        # and OS command injection (ping flood / timeout) payloads work by
        # deliberately making the target slow or busy -- fine against T-210's
        # disposable compose stack, not fine against staging, which is shared
        # with whatever else is running there. Left enabled: the *non*
        # time-based SQLi rule (40018, boolean/error/UNION-based) and every
        # other rule in the default policy -- this is meant to be the
        # aggressive pass, only DoS-risk techniques are carved out.
        - id: 40019 # SQL Injection - MySQL (Time Based)
          threshold: "off"
        - id: 40020 # SQL Injection - Hypersonic SQL (Time Based)
          threshold: "off"
        - id: 40021 # SQL Injection - Oracle (Time Based)
          threshold: "off"
        - id: 40022 # SQL Injection - PostgreSQL (Time Based)
          threshold: "off"
        - id: 90019 # Server Side Code Injection (includes sleep()-style payloads)
          threshold: "off"
        - id: 90020 # Remote OS Command Injection (ping/timeout-based payloads)
          threshold: "off"

  # Machine-readable copy for the workflow's issue-filing step.
  - type: report
    parameters:
      template: "traditional-json"
      reportDir: "../zap-reports"
      reportFile: "zap-full-report"
      reportTitle: "Nightly ZAP full active scan -- staging"

  # Human-readable copy for the retained artifact.
  - type: report
    parameters:
      template: "traditional-html"
      reportDir: "../zap-reports"
      reportFile: "zap-full-report"
      reportTitle: "Nightly ZAP full active scan -- staging"
