# ZAP baseline scan (T-210) rule overrides.
#
# Format (tab-separated): <rule id>	<action>	<url regex (optional)>	<comment>
# action is one of IGNORE | INFO | WARN | FAIL.
# Rule IDs: https://www.zaproxy.org/docs/alerts/
#
# Every entry below must carry an owner + dated justification comment --
# undocumented ignores are not allowed (see T-210's "Done when").
#
# This file intentionally starts with no active overrides. The baseline scan
# is run clean against this app's own security_headers/CORS/cookie config
# (T-011/T-054); add an entry here only when a specific finding is a real,
# understood false positive -- not to silence a finding nobody looked at.

# 2026-07-08 iku-work: rule 10049 ("Storable and Cacheable Content") fires as
# its own "Non-Storable Content" info note on the spider's default probes for
# / , /robots.txt, /sitemap.xml -- none of which are real routes on this
# API-only backend. That note is the *confirmation* that Cache-Control:
# no-store (SecurityHeadersMiddleware, T-210) is doing its job, not a
# finding. Scoped by URL rather than IGNOREd globally, so a genuinely
# cacheable/storable response on a real API route still fails the build.
10049	IGNORE	https://caddy/(|robots\.txt|sitemap\.xml)$	non-storable-content noise on spider default probes, see comment above

# 2026-09-01 iku-work: rule 10035 ("Strict-Transport-Security Header Not Set")
# fires on the same three spider probes as 10049 above -- https://caddy,
# /robots.txt and /sitemap.xml -- and for the same reason: all three are 404s
# from Caddy itself, not responses from this app. The app *does* set HSTS
# (app/middleware/security_headers.py) and so does the production edge
# (Caddyfile.prod), which is why the 65 real routes pass this rule; the dev
# Caddyfile deliberately sets none, because an HSTS header on a self-signed
# `.localhost` host persists in a developer's browser and breaks plain-HTTP
# local work for every other project they open.
#
# The URL column is written the same way 10049's is, but do not read it as a
# guarantee: the first run against the marketing host listed *its* 404s under
# this same IGNORE, so in this ZAP version the pattern is not restricting the
# rule to the host it names. Left in place as documentation of intent, and
# recorded here rather than left as a claim the logs contradict. The marketing
# host no longer needs it either way -- its 404s carry the full header set
# since T-350 moved them into the site block's `handle_errors`.
10035	IGNORE	https://caddy/(|robots\.txt|sitemap\.xml)$	no HSTS on Caddy's own 404s for the spider's default probes, see comment above

# 2026-09-01 iku-work: rule 10015 ("Re-examine Cache-control Directives") on
# the marketing host's own pages -- /, /en/, /en/features/ and robots.txt.
# Those responses carry `public, max-age=300` on purpose (T-307): it is a
# public marketing site whose whole job is to be cached, and the immutable
# rule on /_astro/ assets beside it is the same decision taken further. The
# rule exists to catch sensitive content that should not be stored, which is
# what the *app* host is for -- and there it passes, because
# SecurityHeadersMiddleware sends no-store.
10015	IGNORE	https://marketing\.localhost/.*	public marketing pages are deliberately cacheable, see comment above
