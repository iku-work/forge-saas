# T-205: validated in CI with `promtool check rules` (see
# backend/tests/test_prometheus_alerts.py) and loaded by a local Prometheus
# via `rule_files` (docs/grafana/prometheus.yml) when running `make observe`.
#
# pg_stat_statements exposes mean/max execution time per normalized
# statement, not a true percentile -- there is no way to compute a real p95
# from it. The plan's p95 target is implemented here as a pragmatic stand-in:
# **mean execution time > 500ms, sustained for 15 minutes, on a statement
# called often enough (>100 times) to matter**. True end-to-end p95 (as
# actually experienced by callers) is owned by the k6 load-test suite
# (T-223), not this alert.
groups:
  - name: forge-slow-queries
    rules:
      - alert: SlowQuerySustained
        expr: pg_stat_statements_mean_exec_time > 500 and pg_stat_statements_calls > 100
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Statement {{ $labels.queryid }} averaging {{ $value }}ms over 100+ calls"
          description: >-
            {{ $labels.query }} has averaged over 500ms per execution for at
            least 15 minutes, called over 100 times. See
            docs/runbooks/slow-queries.md for the EXPLAIN ANALYZE workflow.

  # T-225/ASVS V8.1.4: a per-route spike in the *rate-limit rejection* rate
  # (not raw request volume, and deliberately not per-user/per-IP, which
  # would explode Prometheus cardinality and leak individual IPs into
  # metrics storage) is the cardinality-safe proxy for "abnormal traffic" --
  # slowapi's 429 responses (app.middleware.rate_limit) are already surfaced
  # on the http_requests_total{status="429"} series
  # prometheus-fastapi-instrumentator produces for every route
  # (app.core.metrics.init_metrics).
  - name: forge-request-anomalies
    rules:
      - alert: RequestVolumeAnomaly
        expr: sum(rate(http_requests_total{status="429"}[5m])) by (handler) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.handler }} sustaining >1 rate-limit rejection/sec"
          description: >-
            {{ $labels.handler }} has averaged over 1 HTTP 429 response per
            second for at least 5 minutes -- likely an abusive client or
            credential-stuffing attempt being throttled. Investigate the
            source before it escalates to a full rate-limit bypass attempt.

  # T-321: outbound webhooks. Two distinct failures, and only the second is
  # this product's problem -- which is why they are separate rules rather than
  # one "webhooks are unhealthy" alert somebody would learn to ignore.
  - name: forge-outbound-webhooks
    rules:
      # A consumer that exhausted the whole ladder (1 m, 5 m, 30 m, 2 h, 12 h).
      # Their outage, our page only if it is happening broadly -- a single dead
      # endpoint auto-disables itself and notifies its owners without waking
      # anyone here.
      - alert: WebhookDeliveriesDeadLettering
        expr: sum(rate(forge_webhook_deliveries_total{outcome="dead"}[15m])) > 0.05
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Webhook deliveries are being given up ({{ $value }}/sec)"
          description: >-
            Deliveries have been exhausting all six attempts for half an hour.
            One customer's endpoint being down looks like this and resolves
            itself; several at once usually means an egress or DNS problem on
            our side. See docs/runbooks/outbound-webhooks.md.
      # This one *is* ours: work owed to customers that nothing is draining.
      # The queue is the count of rows still awaiting an attempt, so a depth
      # that climbs and never falls means the worker is not consuming -- not
      # that a consumer is slow.
      - alert: WebhookQueueNotDraining
        expr: forge_webhook_queue_depth > 500
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} webhook deliveries pending and not draining"
          description: >-
            The pending-delivery count has stayed above 500 for 15 minutes.
            Check that the ARQ worker is running and that `outbound_webhooks`
            is enabled in *its* configuration -- the delivery job no-ops when
            it is not. docs/runbooks/outbound-webhooks.md.

      # PROD-06. The webhook alert above watches one module's queue; this
      # watches the queue everything else shares -- email, virus scanning,
      # GDPR export and deletion, push, key rotation. None of those fail
      # loudly when the worker stops: the request that enqueued them already
      # returned 200, so the only symptom is that nothing ever happens.
      #
      # Depth rather than age because ARQ does not expose a per-job age, and
      # depth answers the question that matters: work is arriving and
      # nothing is consuming it. A healthy worker drains a spike in seconds,
      # so 50 sustained for ten minutes is not a busy period.
      - alert: JobQueueNotDraining
        expr: forge_arq_queue_depth > 50
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} background jobs queued and not draining"
          description: >-
            The ARQ queue has stayed above 50 for ten minutes. Email,
            virus scanning and GDPR deletion all run here and all fail
            silently -- the requests that enqueued them already succeeded.
            Check `docker compose ps worker` and its healthcheck
            (`arq --check`), then the worker log.

      # The other half, and the one a depth alert cannot see: a worker that
      # died with an empty queue. Depth stays at zero, every dashboard looks
      # calm, and the first symptom is a customer asking where their email
      # went. `up` is Prometheus's own per-target liveness sample.
      # Review OCT-04: scans run on their own queue and worker, invisible to
      # the two alerts either side of this one. A stopped scanner does not
      # fail anything loudly; uploads just stay "scanning" forever.
      - alert: ScanQueueNotDraining
        expr: forge_scan_queue_depth > 20
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} virus scans queued and not draining"
          description: >-
            New uploads cannot be downloaded until scanned. Check
            `docker compose ps scanner-worker clamav`, then their logs.

      - alert: ScannerWorkerDown
        expr: up{job="forge-scanner-worker"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "The scan worker is not responding to scrapes"
          description: >-
            forge-scanner-worker has failed its metrics scrape for five
            minutes. Uploads stay unscanned, and undownloadable, until it
            is back.

      - alert: WorkerDown
        expr: up{job="forge-worker"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "The background worker is not responding to scrapes"
          description: >-
            forge-worker has failed its metrics scrape for five minutes.
            The queue may well be empty and every other dashboard calm --
            that is what makes this the alert that matters. See
            docs/runbooks/degraded-mode.md.

      # PROD-04. The audit found 68% of 38 GB used with 13 GB of reclaimable
      # Docker build cache and nothing watching it. A full disk on a
      # single-box deployment is not a degraded mode: Postgres cannot write
      # a WAL segment, so the database stops, and the recovery is manual.
      #
      # 20% warns, 10% pages. The gap exists because reclaiming space is
      # usually `docker system prune` and takes a minute -- but only if
      # someone is told before the disk is full rather than after.
      - alert: DiskSpaceLow
        expr: >-
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
          / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} < 0.20
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.mountpoint }} is below 20% free"
          description: >-
            Reclaim space before this becomes an outage. `docker system
            prune -af --volumes` is usually the answer on this box -- the
            build cache was 13 GB when this was last measured. Check
            /var/backups/forge too: BACKUP_RETENTION_DAYS may be longer than
            the disk can carry.

      - alert: DiskSpaceCritical
        expr: >-
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
          / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} < 0.10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.mountpoint }} is below 10% free"
          description: >-
            Postgres fails to write a WAL segment on a full disk and the
            product stops. Reclaim space now.
